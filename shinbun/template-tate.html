<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=Dela+Gothic+One&display=swap">
<style>
/* 学級新聞テンプレート
   紙面は A4 たて（210×297mm）で組んである。B4 は全体を拡大して刷る。
   新聞紙そのものの見た目に固定しているので、ダークモードでも紙は白いまま。 */
:root{
  --paper:#fbfaf6;
  --ink:#1c1b19;
  --ink-soft:#55524b;
  --rule:#2a2824;
  --accent:#b8321f;      /* 題字の朱色 */
  --accent-ink:#fff8f2;
  --tint:#efe9dc;        /* 囲み記事の地色 */
  --desk:#d9d6cf;        /* 画面で見るときの机の色 */
  --mincho:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho","IPAMincho","Noto Serif JP",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","IPAGothic","Noto Sans JP",sans-serif;
  --display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans","IPAGothic",sans-serif;
  color-scheme:light;
}
@page{ size:A4 portrait; margin:0; }
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{
  background:var(--desk);
  color:var(--ink);
  font-family:var(--mincho);
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
  padding-inline:16px; padding-block:16px 40px;
}

/* ---------- 画面用のツールバー（印刷されない） ---------- */
.bar{
  max-width:210mm; margin:0 auto 12px; display:flex; flex-wrap:wrap; gap:8px 16px;
  align-items:center; font-family:var(--gothic); font-size:13px; color:var(--ink);
}
.bar .group{ display:flex; gap:4px; align-items:center; }
.bar button{
  font:inherit; font-weight:700; padding:6px 12px; border:1.5px solid var(--rule);
  background:var(--paper); color:var(--ink); border-radius:3px; cursor:pointer;
}
.bar button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); }
.bar button:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
.bar .hint{ color:var(--ink-soft); }

/* 画面では横幅に合わせて縮めて見せる */
.stage{ margin:0 auto; max-width:100%; overflow:hidden; }
.stage-inner{ transform-origin:top left; width:210mm; }

/* ---------- 紙面 ---------- */
.page{
  width:210mm; height:297mm; background:var(--paper); padding:9mm 9mm 8mm;
  display:grid; grid-template-rows:33mm 99mm 76mm 1fr; grid-template-columns:minmax(0,1fr); gap:3mm;
  box-shadow:0 2px 14px rgb(0 0 0 / .18); overflow:hidden;
}

/* 題字まわり */
.mast{ display:flex; gap:3mm; border-bottom:2.2pt solid var(--rule); padding-bottom:2.5mm; }
.mast-title{
  flex:0 0 auto; background:var(--accent); color:var(--accent-ink);
  display:flex; flex-direction:column; justify-content:center; padding:0 6mm; min-width:70mm;
}
.mast-title .name{ font-family:var(--display); font-size:26pt; line-height:1.1; letter-spacing:.04em; }
.mast-title .sub{ font-family:var(--gothic); font-weight:700; font-size:8.5pt; letter-spacing:.2em; margin-top:1.5mm; opacity:.92; }
.mast-info{
  flex:1; display:grid; grid-template-columns:auto 1fr; gap:.6mm 3mm; align-content:center;
  font-family:var(--gothic); font-size:9pt; font-weight:700;
}
.mast-info dt{ color:var(--ink-soft); }
.mast-info dd{ margin:0; }
.mast-info .issue{ font-size:13pt; }
.mast-note{
  flex:0 0 46mm; border:1pt solid var(--rule); padding:2mm 3mm; display:flex; flex-direction:column; justify-content:center;
}
.mast-note .label{ font-family:var(--gothic); font-weight:900; font-size:8pt; color:var(--accent); letter-spacing:.1em; }
.mast-note .text{ font-size:10pt; line-height:1.5; margin-top:1mm; }

/* 段（横の帯） */
.band{ display:flex; flex-direction:row-reverse; gap:3mm; min-height:0; min-width:0; border-bottom:.8pt solid var(--rule); padding-bottom:3mm; }
.band:last-child{ border-bottom:none; padding-bottom:0; }

/* 帯の右端に立てる見出しラベル */
.kicker{
  writing-mode:vertical-rl; flex:0 0 auto; background:var(--ink); color:var(--paper);
  font-family:var(--gothic); font-weight:900; font-size:10pt; letter-spacing:.35em;
  padding:3mm 1.6mm; text-align:center;
}
.kicker.alt{ background:var(--accent); color:var(--accent-ink); }

/* たて書きの記事。子要素は右から左へ並ぶ */
.article{
  writing-mode:vertical-rl; flex:1 1 0; min-width:0; height:100%; overflow:hidden;
  font-size:12pt; line-height:1.72; text-align:justify; line-break:strict;
}
.article h2{
  font-family:var(--gothic); font-weight:900; font-size:2.05em; line-height:1.18;
  margin:0 0 0 .5em; letter-spacing:.02em; text-align:start; text-wrap:balance;
}
.article h3{
  font-family:var(--gothic); font-weight:700; font-size:1.05em; line-height:1.4;
  margin:0 0 0 .9em; color:var(--ink-soft); padding-top:1.5em; text-align:start;
}
.article p{ margin:0; text-indent:1em; }
.article .byline{ font-family:var(--gothic); font-size:.8em; color:var(--ink-soft); text-align:end; margin-right:.6em; }

/* 絵（絵文字）と説明 */
.figure{
  flex:0 0 36mm; display:flex; flex-direction:column; gap:2mm;
}
.figure .pic{
  flex:1; border:1pt solid var(--rule); background:var(--tint);
  display:grid; place-items:center; font-size:64pt; line-height:1;
}
.figure .cap{ font-family:var(--gothic); font-size:7.5pt; line-height:1.45; color:var(--ink-soft); }

/* 囲み（たて書き） */
.memo{
  writing-mode:vertical-rl; flex:0 0 auto; max-width:48mm; height:100%;
  border:1pt solid var(--rule); background:var(--tint); padding:3mm 2.6mm;
  font-size:9.5pt; line-height:1.6; overflow:hidden;
}
.memo .label{ font-family:var(--gothic); font-weight:900; color:var(--accent); margin-left:.6em; display:block; }
.memo p{ margin:0; }

/* 下段：コラム＋よこ書きの囲み */
.boxes{ flex:0 0 64mm; display:flex; flex-direction:column; gap:2.5mm; min-height:0; }
.box{
  border:1pt solid var(--rule); padding:2.4mm 3mm; font-family:var(--gothic); font-size:8.8pt; line-height:1.5;
  flex:1 1 auto; min-height:0; overflow:hidden;
}
.box .label{ display:block; font-weight:900; font-size:9.5pt; border-bottom:.8pt solid var(--rule); padding-bottom:1mm; margin-bottom:1.2mm; }
.box ul{ margin:0; padding:0; list-style:none; display:grid; gap:.6mm; }
.box li{ display:grid; grid-template-columns:auto 1fr; gap:2mm; }
.box li b{ font-variant-numeric:tabular-nums; }
.box p{ margin:0; }
.box .answer{
  margin-top:1.2mm; font-size:7.8pt; color:var(--ink-soft);
  display:inline-block; transform:rotate(180deg); /* こたえは さかさまに */
}
.article.column h2{ font-size:1.55em; }
.article.column .col-name{
  font-family:var(--gothic); font-weight:900; font-size:.85em; color:var(--paper); background:var(--accent);
  padding:.5em .25em; margin-left:.7em; display:inline-block; letter-spacing:.2em;
}

/* 文字の飾り */
.tcy{ text-combine-upright:all; }
em.bouten{ font-style:normal; font-weight:700; text-emphasis:sesame; -webkit-text-emphasis:sesame; }
.box em.bouten, .mast em.bouten{ text-emphasis:none; -webkit-text-emphasis:none; }
ruby rt{ font-size:.5em; font-family:var(--gothic); font-weight:400; }
.no-ruby ruby rt{ display:none; }

@media print{
  body{ background:var(--paper); padding:0; }
  .bar{ display:none; }
  .stage, .stage-inner{ width:auto !important; height:auto !important; transform:none !important; overflow:visible; }
  .page{ box-shadow:none; }
}
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>

<div class="bar" role="toolbar" aria-label="表示の切りかえ">
  <div class="group"><span>ふりがな</span>
    <button type="button" id="ruby-on" aria-pressed="true">あり</button>
    <button type="button" id="ruby-off" aria-pressed="false">なし</button>
  </div>
  <span class="hint">印刷するときは、いっしょに作られる PDF を使ってください</span>
</div>

<div class="stage" id="stage"><div class="stage-inner" id="stage-inner">
  <main class="page" id="page"></main>
</div></div>

<script type="application/json" id="issue-data">__ISSUE_JSON__</script>
<script>
(function(){
  const data = JSON.parse(document.getElementById('issue-data').textContent);
  const page = document.getElementById('page');

  // --- 文字の整形 ---------------------------------------------------------
  // {漢字|かんじ} → ルビ、**ことば** → 傍点、たて書きでは数字を縦中横にする
  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function toFullWidth(d){ return d.replace(/[0-9]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xFEE0)); }
  // ふりがなは、JSON の furigana_from 年生以上で習う漢字をふくむ言葉にだけつける（ふつうは 3。0 はつけない）
  // 1・2年生で習う漢字は学年別漢字配当表のとおり
  const KANJI_BY_GRADE = ['',
    '一右雨円王音下火花貝学気九休玉金空月犬見五口校左三山子四糸字耳七車手十出女小上森人水正生青夕石赤千川先早草足村大男竹中虫町天田土二日入年白八百文木本名目立力林六',
    '引羽雲園遠何科夏家歌画回会海絵外角楽活間丸岩顔汽記帰弓牛魚京強教近兄形計元言原戸古午後語工公広交光考行高黄合谷国黒今才細作算止市矢姉思紙寺自時室社弱首秋週春書少場色食心新親図数西声星晴切雪船線前組走多太体台地池知茶昼長鳥朝直通弟店点電刀冬当東答頭同道読内南肉馬売買麦半番父風分聞米歩母方北毎妹万明鳴毛門夜野友用曜来里理話'];
  const rubyFrom = data.furigana_from == null ? 3 : Number(data.furigana_from);
  const known = (() => { let k = ''; for (let g = 1; g < rubyFrom && g < KANJI_BY_GRADE.length; g++) k += KANJI_BY_GRADE[g]; return k; })();
  const needsRuby = base => rubyFrom > 0 && [...base].some(ch => /[\u4e00-\u9fff]/.test(ch) && !known.includes(ch));
  const rubyRe = /\{([^|{}]+)\|([^{}]+)\}/g;
  const rubyOut = (m, base, yomi) => needsRuby(base) ? '<ruby>' + base + '<rt>' + yomi + '</rt></ruby>' : base;
  function fmt(s, vertical){
    let h = esc(s);
    h = h.replace(rubyRe, rubyOut);
    h = h.replace(/\*\*(.+?)\*\*/g, '<em class="bouten">$1</em>');
    if (vertical){
      // タグの中は変えないよう、テキスト部分だけ数字を処理する
      h = h.split(/(<[^>]+>)/).map(part => part.startsWith('<') ? part :
        part.replace(/[0-9]+/g, n => n.length <= 2 ? '<span class="tcy">' + n + '</span>' : toFullWidth(n))
            .replace(/[!?！？]{2}/g, m => '<span class="tcy">' + m.replace(/！/g,'!').replace(/？/g,'?') + '</span>')
      ).join('');
    }
    return h;
  }
  const paras = (arr, v) => (Array.isArray(arr) ? arr : [arr]).filter(Boolean).map(t => '<p>' + fmt(t, v) + '</p>').join('');

  // --- 紙面を組む ---------------------------------------------------------
  const d = data, s = d.school || {}, w = d.world || {}, c = d.column || {};
  const boxes = (d.boxes || []).map(b => {
    let inner = '<span class="label">' + fmt(b.title) + '</span>';
    if (b.items) inner += '<ul>' + b.items.map(it => {
      const [k, ...rest] = String(it).split('｜');
      return rest.length ? '<li><b>' + fmt(k) + '</b><span>' + fmt(rest.join('｜')) + '</span></li>' : '<li><span></span><span>' + fmt(k) + '</span></li>';
    }).join('') + '</ul>';
    if (b.body) inner += paras(b.body, false);
    if (b.answer) inner += '<div><span class="answer">こたえ：' + fmt(b.answer) + '</span></div>';
    return '<section class="box">' + inner + '</section>';
  }).join('');

  page.innerHTML = `
    <header class="mast">
      <div class="mast-title"><div class="name">${fmt(d.title || '学級新聞')}</div><div class="sub">${fmt(d.subtitle || '')}</div></div>
      <dl class="mast-info">
        <dt>号</dt><dd class="issue">${d.issue ? '第' + esc(d.issue) + '号' : ''}</dd>
        <dt>発行日</dt><dd>${fmt(d.date || '')}</dd>
        <dt>発行</dt><dd>${fmt(d.publisher || '')}</dd>
      </dl>
      ${d.note ? `<div class="mast-note"><span class="label">${fmt(d.note.label || 'きょうのひとこと')}</span><span class="text">${fmt(d.note.text || '')}</span></div>` : ''}
    </header>

    <section class="band" aria-label="学校のこと">
      <div class="kicker">${fmt(s.kicker || '学校のできごと')}</div>
      <article class="article" data-fit>
        <h2>${fmt(s.headline || '', true)}</h2>
        ${s.subhead ? `<h3>${fmt(s.subhead, true)}</h3>` : ''}
        ${paras(s.body, true)}
      </article>
      ${s.emoji ? `<figure class="figure" style="margin:0"><div class="pic" aria-hidden="true">${esc(s.emoji)}</div>${s.caption ? `<figcaption class="cap">${fmt(s.caption)}</figcaption>` : ''}</figure>` : ''}
    </section>

    <section class="band" aria-label="世の中のニュース">
      <div class="kicker alt">${fmt(w.kicker || '世の中のニュース')}</div>
      <article class="article" data-fit>
        <h2>${fmt(w.headline || '', true)}</h2>
        ${w.subhead ? `<h3>${fmt(w.subhead, true)}</h3>` : ''}
        ${paras(w.body, true)}
        ${w.source ? `<p class="byline">${fmt(w.source, true)}</p>` : ''}
      </article>
      ${w.memo ? `<aside class="memo" data-fit-memo><span class="label">${fmt(w.memo.label || 'ことばメモ', true)}</span>${paras(w.memo.body, true)}</aside>` : ''}
    </section>

    <section class="band" aria-label="コラム">
      <article class="article column" data-fit>
        <span class="col-name">${fmt(c.name || 'コラム', true)}</span>
        ${c.headline ? `<h2>${fmt(c.headline, true)}</h2>` : ''}
        ${paras(c.body, true)}
        ${c.byline ? `<p class="byline">${fmt(c.byline, true)}</p>` : ''}
      </article>
      ${boxes ? `<div class="boxes">${boxes}</div>` : ''}
    </section>`;

  // --- 文字の大きさを記事ごとに合わせる -----------------------------------
  // あふれない範囲でいちばん大きい文字にする（子どもが読みやすいように上限は大きめ）
  function fit(el, min, max){
    // たて書きでは scrollWidth があてにならないので、見出しや段落が枠の外に出ていないかを直接しらべる
    const overflows = () => {
      const box = el.getBoundingClientRect();
      for (const child of el.children) for (const r of child.getClientRects()){
        if (r.width === 0 && r.height === 0) continue;
        if (r.left < box.left - 1 || r.right > box.right + 1 || r.top < box.top - 1 || r.bottom > box.bottom + 1) return true;
      }
      return false;
    };
    let lo = min, hi = max;
    for (let i = 0; i < 12; i++){
      const mid = (lo + hi) / 2;
      el.style.fontSize = mid + 'pt';
      if (overflows()) hi = mid; else lo = mid;
    }
    el.style.fontSize = lo + 'pt';
    el.dataset.fitted = lo.toFixed(1);
    if (lo <= min + 0.05 && overflows()) el.dataset.overflow = 'true';
  }
  function fitAll(){
    page.querySelectorAll('[data-fit]').forEach(el => fit(el, 8, 15));
    page.querySelectorAll('[data-fit-memo]').forEach(el => fit(el, 7, 11));
    page.querySelectorAll('.box').forEach(el => fit(el, 6.5, 10));
    document.documentElement.dataset.ready = 'true';
  }

  // --- 画面では横幅に合わせて縮小 ---------------------------------------
  const stage = document.getElementById('stage'), inner = document.getElementById('stage-inner');
  function scaleToScreen(){
    if (window.matchMedia('print').matches) return;
    const pageW = page.offsetWidth, pageH = page.offsetHeight;
    const k = Math.min(1, stage.parentElement.clientWidth / pageW);
    inner.style.transform = 'scale(' + k + ')';
    stage.style.width = pageW * k + 'px';
    stage.style.height = pageH * k + 'px';
  }

  // --- ふりがなの切りかえ -------------------------------------------------
  function setRuby(on){
    document.body.classList.toggle('no-ruby', !on);
    document.getElementById('ruby-on').setAttribute('aria-pressed', on);
    document.getElementById('ruby-off').setAttribute('aria-pressed', !on);
    fitAll();
    try { localStorage.setItem('shinbun-ruby', on ? '1' : '0'); } catch(e){}
  }
  document.getElementById('ruby-on').addEventListener('click', () => setRuby(true));
  document.getElementById('ruby-off').addEventListener('click', () => setRuby(false));
  let rubyPref = true;
  try { rubyPref = localStorage.getItem('shinbun-ruby') !== '0'; } catch(e){}
  if (new URLSearchParams(location.search).get('ruby') === '0') rubyPref = false;

  const start = () => { setRuby(rubyPref); scaleToScreen(); };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
  window.addEventListener('resize', scaleToScreen);
})();
</script>
