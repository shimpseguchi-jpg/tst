<title>学級新聞メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Shippori+Mincho+B1:wght@500;700;800&family=BIZ+UDPMincho:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style id="paper-css">
.page{
  --paper:#f7f5f0;
  --ink:#151412;
  --ink-soft:#4d4a44;
  --rule:#151412;
  --tint:#e8e4da;       /* 囲みの地色 */
  --desk:#cfccc5;       /* 画面で見るときの机の色 */
  --blackletter:"UnifrakturMaguntia","Old English Text MT",serif;
  --latin:"Playfair Display","Times New Roman",serif;
  --head:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","IPAMincho","Noto Serif JP",serif;
  --body:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho","IPAMincho","Noto Serif JP",serif;
}
/* ---------- 紙面 ---------- */
.page{
  width:210mm; height:297mm; background:var(--paper); padding:9mm 10mm 8mm;
  display:grid; grid-template-rows:auto minmax(0,1fr) 82mm 31mm; grid-template-columns:minmax(0,1fr); gap:3.2mm;
  box-shadow:0 2px 14px rgb(0 0 0 / .2); overflow:hidden;
}

/* 題字 */
.mast{ display:grid; grid-template-columns:38mm minmax(0,1fr) 38mm; align-items:center; column-gap:4mm; }
.ear{
  border:.6pt solid var(--rule); padding:1.6mm 2.2mm; font-size:7.4pt; line-height:1.45; align-self:center;
}
.ear .label{ display:block; font-family:var(--latin); font-style:italic; font-weight:700; font-size:7.6pt; margin-bottom:.6mm; }
.ear.right{ text-align:center; }
.ear.right .num{ font-family:var(--latin); font-weight:900; font-size:15pt; line-height:1.1; font-variant-numeric:lining-nums; }
.name-block{ text-align:center; }
.name{
  font-family:var(--blackletter); font-weight:400; font-size:40pt; line-height:1; margin:0; letter-spacing:.005em;
  white-space:nowrap;
}
.name.ja{ font-family:var(--head); font-weight:800; font-size:34pt; letter-spacing:.12em; }
.name-sub{ font-family:var(--head); font-weight:700; font-size:9pt; letter-spacing:.5em; margin-top:1.4mm; padding-left:.5em; }
.dateline{
  grid-column:1 / -1; margin-top:2.4mm;
  border-top:.6pt solid var(--rule); border-bottom:.6pt solid var(--rule);
  box-shadow:0 -1.2mm 0 -1mm var(--rule), 0 1.2mm 0 -1mm var(--rule); /* 二重罫 */
  display:flex; justify-content:space-between; gap:4mm; padding:1.1mm .5mm;
  font-family:var(--latin); font-size:7.6pt; letter-spacing:.14em; text-transform:uppercase; font-variant-numeric:lining-nums;
}
.dateline .ja{ font-family:var(--body); letter-spacing:.06em; text-transform:none; }

/* 記事の共通部品 */
.kicker{
  display:flex; align-items:baseline; gap:2mm; font-size:7.6pt; margin-bottom:1.2mm;
  border-top:2.4pt solid var(--rule); padding-top:1.2mm;
}
.kicker .en{ font-family:var(--latin); font-weight:900; letter-spacing:.24em; text-transform:uppercase; }
.kicker .ja{ font-family:var(--head); font-weight:700; color:var(--ink-soft); letter-spacing:.1em; }
h2{ font-family:var(--head); font-weight:800; line-height:1.22; margin:0; text-wrap:balance; letter-spacing:.01em; }
.deck{ font-family:var(--head); font-weight:500; color:var(--ink-soft); margin:1.2mm 0 0; line-height:1.4; text-wrap:balance; }
.cols{
  column-gap:5mm; column-rule:.5pt solid var(--rule); column-fill:balance;
  min-height:0; overflow:hidden; text-align:justify; line-height:1.75; font-size:10.5pt; line-break:strict;
}
.cols p{ margin:0; text-indent:1em; }
.dropcap > p:first-child{ text-indent:0; }
.dropcap > p:first-child::first-letter{
  float:left; font-family:var(--head); font-weight:800; font-size:3.35em; line-height:1; margin:.04em .12em 0 0;
}
.source, .byline{ font-family:var(--latin); font-style:italic; font-size:.85em; color:var(--ink-soft); text-align:right; text-indent:0 !important; margin-top:.4em !important; }
.source .ja, .byline{ font-family:var(--body); font-style:normal; }

/* トップ記事（学校） */
.lead{ display:flex; flex-direction:column; min-height:0; }
.lead h2{ font-size:25pt; }
.lead .deck{ font-size:11pt; }
.lead-body{ flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 52mm; gap:5mm; margin-top:3mm; }
.lead-body .cols{ column-count:2; height:100%; }
.side{ display:flex; flex-direction:column; gap:2.4mm; min-height:0; border-left:.5pt solid var(--rule); padding-left:5mm; }
.photo{ margin:0; display:flex; flex-direction:column; gap:1.2mm; flex:1; min-height:0; }
.photo .pic{
  flex:1; min-height:24mm; background:var(--tint); display:grid; place-items:center;
  font-size:54pt; line-height:1; border:.5pt solid var(--rule);
}
.photo figcaption{ font-size:7.4pt; line-height:1.5; color:var(--ink-soft); }
.photo figcaption::before{ content:"▲ "; }
.pull{
  margin:0; padding:2mm 0; border-top:1.4pt solid var(--rule); border-bottom:.5pt solid var(--rule);
  font-family:var(--head); font-weight:700; font-size:11.5pt; line-height:1.45; text-align:center;
}
.pull::before{ content:"“"; display:block; font-family:var(--latin); font-weight:900; font-size:26pt; line-height:.6; margin-top:1.5mm; }

/* 2段目：世の中＋コラム */
.second{ display:grid; grid-template-columns:minmax(0,1.85fr) minmax(0,1fr); gap:5mm; min-height:0; }
.world, .opinion{ display:flex; flex-direction:column; min-height:0; }
.world h2{ font-size:17pt; }
.world .deck{ font-size:9.5pt; }
.world .cols{ column-count:2; flex:1; margin-top:2.4mm; }
.memo{
  break-inside:avoid; background:var(--tint); padding:1.8mm 2.4mm; margin-top:1.6mm;
  font-size:.86em; line-height:1.6; text-align:left;
}
.memo .label{ font-family:var(--head); font-weight:800; display:block; }
.memo p{ text-indent:0; }
.opinion{ border-left:.5pt solid var(--rule); padding-left:5mm; }
.opinion .kicker .en{ font-style:italic; }
.opinion h2{ font-size:14pt; font-weight:700; }
.opinion .colname{ font-family:var(--head); font-weight:800; font-size:8pt; letter-spacing:.3em; margin-bottom:1mm; }
.opinion .cols{ column-count:1; flex:1; margin-top:2.4mm; }

/* 3段目：囲み */
.notices{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); border-top:2.4pt solid var(--rule); min-height:0; }
.box{ padding:1.8mm 4mm 0; font-size:8.6pt; line-height:1.5; min-height:0; overflow:hidden; }
.box + .box{ border-left:.5pt solid var(--rule); }
.box:first-child{ padding-left:0; }
.box .label{ display:block; font-family:var(--head); font-weight:800; font-size:1.08em; margin-bottom:1mm; }
.box ul{ margin:0; padding:0; list-style:none; display:grid; gap:.3mm; }
.box li{ display:grid; grid-template-columns:auto 1fr; gap:2.4mm; }
.box li b{ font-family:var(--latin); font-weight:700; font-variant-numeric:lining-nums tabular-nums; }
.box p{ margin:0; }
.box .answer{ display:inline-block; margin-top:1mm; font-size:.88em; color:var(--ink-soft); transform:rotate(180deg); }

/* 文字の飾り */
em.bouten{ font-style:normal; font-weight:700; text-emphasis:sesame; -webkit-text-emphasis:sesame; }
h2 em.bouten, .deck em.bouten, .box em.bouten, .ear em.bouten{ text-emphasis:none; -webkit-text-emphasis:none; font-weight:inherit; }
ruby rt{ font-size:.5em; font-weight:400; font-family:var(--body); }
.no-ruby ruby rt{ display:none; }


.photo .pic img{ width:100%; height:100%; object-fit:cover; display:block; }
.page [contenteditable]:hover{ outline:1px dashed rgb(0 0 0 / .25); outline-offset:1px; }
.page [contenteditable]:focus{ outline:1.5px solid #2f6f8f; outline-offset:1px; background:rgb(47 111 143 / .06); }
</style>
<style>
/* ---------- アプリの画面（紙面の外側） ---------- */
:root{
  --ui-bg:#e9e7e1;
  --ui-panel:#fbfaf7;
  --ui-text:#1d1c1a;
  --ui-muted:#66625a;
  --ui-line:#d3cfc6;
  --ui-field:#ffffff;
  --ui-accent:#2f6f8f;      /* 青インク */
  --ui-accent-text:#ffffff;
  --ui-warn-bg:#fff4d6;
  --ui-warn-text:#6b4d00;
  --ui-font:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ui-bg:#1b1c1e; --ui-panel:#25272a; --ui-text:#ecebe7; --ui-muted:#a7a49c; --ui-line:#3a3d41;
    --ui-field:#1e2023; --ui-accent:#7fb6d1; --ui-accent-text:#10202a; --ui-warn-bg:#3a3220; --ui-warn-text:#f0d9a0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ui-bg:#1b1c1e; --ui-panel:#25272a; --ui-text:#ecebe7; --ui-muted:#a7a49c; --ui-line:#3a3d41;
  --ui-field:#1e2023; --ui-accent:#7fb6d1; --ui-accent-text:#10202a; --ui-warn-bg:#3a3220; --ui-warn-text:#f0d9a0;
  color-scheme:dark;
}
*{ box-sizing:border-box; }
[hidden]{ display:none !important; }
body{ margin:0; background:var(--ui-bg); color:var(--ui-text); font-family:var(--ui-font); font-size:14px; line-height:1.6; }
.app{
  display:grid; grid-template-columns:minmax(0,380px) minmax(0,1fr); gap:20px;
  max-width:1280px; margin:0 auto; padding-inline:16px; padding-block:16px 32px; align-items:start;
}
@media (max-width:860px){ .app{ grid-template-columns:minmax(0,1fr); } }

.panel{ background:var(--ui-panel); border:1px solid var(--ui-line); border-radius:6px; padding:16px; display:grid; gap:14px; }
.brand{ display:flex; align-items:baseline; gap:10px; }
.brand h1{ margin:0; font-size:18px; font-weight:700; }
.brand span{ color:var(--ui-muted); font-size:12px; }
.lede{ margin:0; color:var(--ui-muted); font-size:13px; }

.field{ display:grid; gap:4px; }
.field label{ font-weight:700; font-size:13px; display:flex; justify-content:space-between; gap:8px; }
.field label small{ font-weight:400; color:var(--ui-muted); }
textarea, input[type=text], input[type=number], select{
  width:100%; font:inherit; color:var(--ui-text); background:var(--ui-field);
  border:1px solid var(--ui-line); border-radius:4px; padding:8px 10px;
}
textarea{ resize:vertical; min-height:84px; }
textarea:focus, input:focus, select:focus{ outline:2px solid var(--ui-accent); outline-offset:0; border-color:transparent; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

button{ font:inherit; cursor:pointer; border-radius:4px; }
.btn{ padding:9px 14px; border:1px solid var(--ui-line); background:var(--ui-field); color:var(--ui-text); font-weight:700; }
.btn.primary{ background:var(--ui-accent); color:var(--ui-accent-text); border-color:var(--ui-accent); font-size:15px; padding:11px 16px; }
.btn:disabled{ opacity:.5; cursor:default; }
.btn:focus-visible{ outline:2px solid var(--ui-accent); outline-offset:2px; }
.actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.actions .primary{ flex:1; }
.status{ font-size:13px; color:var(--ui-muted); min-height:1.6em; margin:0; }
.status.error{ color:#b3261e; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .status.error{ color:#ff8a80; } }
:root[data-theme="dark"] .status.error{ color:#ff8a80; }

.checks{ background:var(--ui-warn-bg); color:var(--ui-warn-text); border-radius:4px; padding:10px 12px; font-size:13px; }
.checks b{ display:block; margin-bottom:2px; }
.checks ul{ margin:0; padding-left:1.2em; }

details{ border-top:1px solid var(--ui-line); padding-top:10px; }
summary{ cursor:pointer; font-weight:700; font-size:13px; }
details[open] summary{ margin-bottom:10px; }
details .grid{ display:grid; gap:10px; }

.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--ui-line); margin:-4px 0 2px; }
.tabs button{
  border:0; background:none; color:var(--ui-muted); padding:8px 12px; font-weight:700; border-bottom:3px solid transparent; border-radius:0;
}
.tabs button[aria-selected="true"]{ color:var(--ui-text); border-bottom-color:var(--ui-accent); }
.tabs button:focus-visible{ outline:2px solid var(--ui-accent); outline-offset:-2px; }
.tabs .count{ font-weight:400; font-size:12px; margin-left:4px; }
.tabpanel{ display:grid; gap:14px; }
.qgroup{ display:grid; gap:10px; border-top:1px solid var(--ui-line); padding-top:12px; }
.qgroup h2{ margin:0; font-size:14px; }
.qgroup .why{ margin:-6px 0 0; font-size:12px; color:var(--ui-muted); }
.qnum{ display:inline-block; min-width:2.2em; color:var(--ui-accent); font-variant-numeric:tabular-nums; }
.grade-range{ display:flex; align-items:center; gap:6px; }
.grade-range select{ flex:1; }
.clsbar{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.clsbar select{ flex:1; min-width:10em; width:auto; }
.clsbar .btn{ padding:6px 10px; font-size:13px; }
.clsbar .lbl{ font-size:13px; font-weight:700; }
.sync{ margin:0; font-size:12px; color:var(--ui-muted); }
.photo-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; }
.photo-row input[type=file]{ font-size:12px; max-width:100%; }

/* プレビュー */
.preview{ display:grid; gap:10px; min-width:0; position:sticky; top:calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width:860px){ .preview{ position:static; } }
.pbar{ display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; font-size:13px; }
.pbar .seg{ display:inline-flex; border:1px solid var(--ui-line); border-radius:4px; overflow:hidden; }
.pbar .seg button{ border:0; border-radius:0; padding:5px 10px; background:var(--ui-field); color:var(--ui-text); }
.pbar .seg button[aria-pressed="true"]{ background:var(--ui-text); color:var(--ui-panel); }
.pbar .spacer{ flex:1; }
.pbar .ruby-select{ width:auto; padding:5px 8px; }
.pnote{ margin:0; font-size:12px; color:var(--ui-muted); }
.stage{ overflow:hidden; max-width:100%; }
.stage-inner{ transform-origin:top left; width:210mm; }
.sample-flag{
  display:inline-block; font-size:11px; font-weight:700; letter-spacing:.08em; padding:2px 8px; border-radius:99px;
  background:var(--ui-text); color:var(--ui-panel);
}
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }
</style>

<div class="app">
  <div class="panel">
    <div class="brand"><h1>学級新聞メーカー</h1><span>メモを書くだけで学級新聞に</span></div>
    <div class="clsbar">
      <label class="lbl" for="cls">つくる新聞</label>
      <select id="cls"></select>
      <button type="button" class="btn" id="cls-add">＋ 新聞をふやす</button>
      <button type="button" class="btn" id="cls-del">この新聞を消す</button>
    </div>
    <div class="clsbar" id="cls-confirm" hidden>
      <span id="cls-confirm-text"></span>
      <button type="button" class="btn" id="cls-del-yes">消す</button>
      <button type="button" class="btn" id="cls-del-no">やめる</button>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-make" aria-selected="true" aria-controls="panel-make">新聞をつくる</button>
      <button type="button" role="tab" id="tab-class" aria-selected="false" aria-controls="panel-class">クラスのこと<span class="count" id="profile-count"></span></button>
    </div>
  <form class="tabpanel" id="form" role="tabpanel" aria-labelledby="tab-make" autocomplete="off">
    <p class="lede">思いついたことを、話すように書いてください。箇条書きでもかまいません。AIが子ども向けの記事にして、右の紙面に組みます。</p>

    <div class="field">
      <label for="in-school">① 学校のこと <small>いちばん大きな記事になります</small></label>
      <textarea id="in-school" rows="5" placeholder="例）きょうから運動会のリレー練習。はじめバトンを落としてたけど、声をかけあったらうまくいくようになった。「声を出すと見なくても分かる」と言ってた子がいた。"></textarea>
    </div>
    <div class="field">
      <label for="in-world">② 世の中のニュース <small>空らんなら季節の話題にします</small></label>
      <textarea id="in-world" rows="3" placeholder="例）今夜は十五夜。でも満月は2日後の27日らしい（仙台市天文台）"></textarea>
    </div>
    <div class="field">
      <label for="in-other">③ その他 <small>コラム・予定・クイズなど</small></label>
      <textarea id="in-other" rows="4" placeholder="例）空を見上げる時間って大事、みたいなコラム。来週の予定：28日全校朝会、30日リレー練習、2日係決め。クイズは秋の七草。"></textarea>
    </div>

    <div class="photo-row">
      <label for="in-photo"><b>写真</b>（なくてもよい）</label>
      <input type="file" id="in-photo" accept="image/*">
      <button type="button" class="btn" id="photo-clear" hidden>写真を外す</button>
    </div>

    <div class="actions">
      <button type="submit" class="btn primary" id="go">AIで新聞にする</button>
      <button type="button" class="btn" id="stop" hidden>止める</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="checks" id="checks" hidden></div>

    <div class="field" id="revise-box" hidden>
      <label for="in-revise">直したいこと <small>例）見出しをもっと元気に／2年生向けに</small></label>
      <div class="actions">
        <input type="text" id="in-revise" placeholder="ひとことで伝えてください">
        <button type="button" class="btn" id="revise">AIで直す</button>
      </div>
    </div>

    <details id="settings">
      <summary>新聞の設定（名前・学年・号数・日付）</summary>
      <div class="grid">
        <div class="row2">
          <div class="field"><label for="s-title">新聞の名前</label><input type="text" id="s-title" value="なかよし新聞"></div>
          <div class="field"><label for="s-title-en">英語の題字 <small>空らんならAIが考えます</small></label><input type="text" id="s-title-en" value="The Nakayoshi Times"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="s-class">クラス</label><input type="text" id="s-class" value="4年1組"></div>
          <div class="field"><label for="s-grade">読む子の学年 <small>異学年なら範囲で</small></label>
            <div class="grade-range"><select id="s-grade" aria-label="いちばん下の学年"><option value="1" selected>1年生</option><option value="2">2年生</option><option value="3">3年生</option><option value="4">4年生</option><option value="5">5年生</option><option value="6">6年生</option></select><span>〜</span><select id="s-grade-max" aria-label="いちばん上の学年"><option value="1" selected>1年生</option><option value="2">2年生</option><option value="3">3年生</option><option value="4">4年生</option><option value="5">5年生</option><option value="6">6年生</option></select></div>
          </div>
        </div>
        <div class="row2">
          <div class="field"><label for="s-issue">号</label><input type="number" id="s-issue" value="1" min="1"></div>
          <div class="field"><label for="s-date">発行日</label><input type="text" id="s-date" value=""></div>
        </div>
        <div class="row2">
          <div class="field"><label for="s-publisher">発行</label><input type="text" id="s-publisher" value="4年1組 担任"></div>
          <div class="field"><label for="s-colname">コラムの名前</label><input type="text" id="s-colname" value="先生のまど"></div>
        </div>
      </div>
    </details>
    <p class="sync" id="sync"></p>
  </form>

  <section class="tabpanel" id="panel-class" role="tabpanel" aria-labelledby="tab-class" hidden>
    <p class="lede">クラスや学校のことを教えてください。AIが記事を書くときに毎回参考にします（書いていない出来事を作ることはしません）。<br>わからない・書きたくない質問は空らんのままでかまいません。答えは自動で保存されます。</p>
    <div id="profile-fields"></div>
    <p class="sync" id="sync2"></p>
  </section>
  </div>

  <section class="preview" aria-label="紙面">
    <div class="pbar">
      <span class="sample-flag" id="sample-flag">見本</span>
      <label for="ruby-from">ふりがな</label>
      <select id="ruby-from" class="ruby-select">
        <option value="3" selected>3年生以上で習う漢字</option>
        <option value="2">2年生以上で習う漢字</option>
        <option value="1">すべての漢字</option>
        <option value="0">つけない</option>
      </select>
      <span class="spacer"></span>
      <button type="button" class="btn primary" id="save">印刷用ファイルを保存</button>
    </div>

</div>

      "body": [

        "{月|つき}は、{見|み}るたびに{形|かたち}がかわります。きのうとちがう{今日|きょう}を、いちばん{分|わ}かりやすく{教|おし}えてくれるのが、{月|つき}なのかもしれません。{今夜|こんや}、{家|いえ}の{人|ひと}といっしょに、{少|すこ}しだけ{空|そら}を{見上|みあ}げてみてください。どんな{形|かたち}に{見|み}えたか、あした{教|おし}えてくださいね。"
      ],
      "byline": "（{担任|たんにん}より）"
    },
    "boxes": [
      {
        "title": "{来週|らいしゅう}の{予定|よてい}",
        "items": [
          "9/28（{月|げつ}）｜{全校|ぜんこう}{朝会|ちょうかい}",
          "9/30（{水|すい}）｜リレー{練習|れんしゅう}（{校庭|こうてい}）",
          "10/2（{金|きん}）｜{運動会|うんどうかい}の{係|かかり}{決|き}め"
        ]
      },
      {
        "title": "きょうのクイズ",
        "body": "お{月見|つきみ}でかざる「{秋|あき}の{七草|ななくさ}」。すすき{以外|いがい}に、いくつ{言|い}えるかな？",
        "answer": "はぎ・くず・なでしこ・おみなえし・ふじばかま・ききょう"
      }
    ]
  };
  const $ = id => document.getElementById(id);
  const page = $('page');
  let article = SAMPLE;          // いま紙面に出している記事（AI が返したもの）
  let isSample = true;
  let photo = null;              // 写真（data URL）。保存はしない
  let rubyFrom = 3;             // この学年以上で習う漢字にふりがなをつける（0 はつけない）

  // ---------------------------------------------------------------------------
  // クラスのこと（基礎知識）の質問
  // ---------------------------------------------------------------------------
  const QUESTIONS = [
    { group: 'クラスの基本', why: '記事の書き出しやコラムのしめくくりに使います。', items: [
      { id: 'p-size', q: '人数（だいたいでOK）', ph: '例）28人' },
      { id: 'p-goal', q: '学級目標', ph: '例）「ありがとう」が言えるクラス' },
      { id: 'p-motto', q: 'クラスの合言葉・スローガン・クラスの名前', ph: '例）「チーム4の1」、合言葉は「やってみよう」' },
      { id: 'p-teacher', q: '子どもたちからの先生の呼ばれ方', ph: '例）〇〇先生、〇〇ちゃん先生' },
      { id: 'p-first', q: 'コラムでの先生の一人称', ph: '例）先生は／わたしは' },
      { id: 'p-roles', q: 'クラスの係・当番の名前', ph: '例）生き物係、図書係、お楽しみ係、日直', area: true },
      { id: 'p-routines', q: 'クラス独自の活動や時間の名前', ph: '例）朝の会の「1分スピーチ」、金曜日の「なかよしタイム」', area: true },
      { id: 'p-living', q: 'クラスで育てている生き物・植物', ph: '例）メダカ（名前は「メダ吉」）、ホウセンカ' },
      { id: 'p-boom', q: '最近クラスではやっていること・がんばっていること', ph: '例）休み時間のドッジボール、なわとびの二重とび', area: true },
    ]},
    { group: '学校と地域', shared: true, why: '「うちの学校のことだ」と感じられる一言を入れるために使います。どの新聞にも共通なので、1回答えればOKです。', items: [
      { id: 'p-schoolname', q: '学校名（新聞にのせてよい場合だけ）', ph: '例）〇〇市立〇〇小学校　※のせないなら空らん' },
      { id: 'p-school', q: '学校の特色（シンボル・伝統・有名な場所）', ph: '例）校庭の大きなイチョウ、毎年のもちつき大会、屋上の菜園', area: true },
      { id: 'p-schoolliving', q: '学校で飼っている生き物', ph: '例）ウサギのモカ、池のコイ' },
      { id: 'p-area', q: '校区・地域の特色（自然・名物・施設・行事）', ph: '例）近くに〇〇川、名物は梨、秋に地域の祭り', area: true },
    ]},
    { group: '行事と予定', why: '「運動会まであと〇日」や予定の囲みを正しく書くために使います。', items: [
      { id: 'p-events', q: '今学期の主な行事と日付（1行に1つ）', ph: '例）\n10/9 運動会\n10/24 遠足（〇〇公園）\n11/15 学習発表会', area: true, rows: 5 },
      { id: 'p-weekly', q: '毎週・毎月決まっていること', ph: '例）月曜は全校朝会、水曜は5時間授業、毎月1回の読み聞かせ', area: true },
    ]},
    { group: 'いま学習していること', why: '世の中のニュースやクイズを授業とつなげるために使います。学期が変わったら書きかえてください。', items: [
      { id: 'p-ja', q: '国語', ph: '例）「ごんぎつね」、漢字辞典の使い方' },
      { id: 'p-math', q: '算数', ph: '例）わり算の筆算、角の大きさ' },
      { id: 'p-sci', q: '理科', ph: '例）月と星、とじこめた空気と水' },
      { id: 'p-soc', q: '社会', ph: '例）ごみのゆくえ、水はどこから' },
      { id: 'p-etc', q: 'そのほか（総合・道徳・外国語・音楽・図工・体育など）', ph: '例）総合で地域の川の調べ学習、音楽で「〇〇」のリコーダー', area: true },
    ]},
    { group: '書き方の好み', why: 'AIの文章のトーンを先生に合わせるために使います。', items: [
      { id: 'p-readers', q: '新聞を読む人', select: ['', '子どもだけ', '子どもと保護者（家庭への呼びかけも入れる）'] },
      { id: 'p-tone', q: '記事やコラムの口調', select: ['', 'やわらかく、親しみやすく', 'ふつう', 'きりっと、ていねいに'] },
      { id: 'p-value', q: '学級新聞で大切にしたいこと', ph: '例）一人ひとりのがんばりを見つけて伝える、失敗も前向きに書く', area: true },
      { id: 'p-avoid', q: '使わないでほしい言葉・ふれないでほしい話題', ph: '例）「えらい」「ダメ」は使わない、順位の話は書かない', area: true },
      { id: 'p-other', q: 'そのほか、AIに知っておいてほしいこと', ph: '例）1〜5年生の縦割りのホーム。上の学年がリーダー役をしている', area: true },
    ]},
  ];
  const PROFILE_IDS = QUESTIONS.flatMap(g => g.items.map(it => it.id));
  function buildQuestions(){
    let n = 0;
    $('profile-fields').innerHTML = QUESTIONS.map(g => `
      <div class="qgroup"><h2>${esc(g.group)}</h2><p class="why">${esc(g.why)}</p>
      ${g.items.map(it => {
        n++;
        const label = `<label for="${it.id}"><span><span class="qnum">Q${n}</span>${esc(it.q)}</span></label>`;
        if (it.select) return `<div class="field">${label}<select id="${it.id}">${it.select.map(o => `<option value="${esc(o)}">${o ? esc(o) : '（えらばない）'}</option>`).join('')}</select></div>`;
        if (it.area) return `<div class="field">${label}<textarea id="${it.id}" rows="${it.rows || 2}" placeholder="${esc(it.ph)}"></textarea></div>`;
        return `<div class="field">${label}<input type="text" id="${it.id}" placeholder="${esc(it.ph)}"></div>`;
      }).join('')}</div>`).join('');
  }
  function profileCount(){
    const done = PROFILE_IDS.filter(id => $(id).value.trim()).length;
    $('profile-count').textContent = `${done}/${PROFILE_IDS.length}`;
  }
  // AI にわたす「クラスの基礎知識」（答えのある質問だけ）
  function profileBlock(){
    const lines = [];
    for (const g of QUESTIONS){
      const answered = g.items.filter(it => $(it.id).value.trim());
      if (!answered.length) continue;
      lines.push(`## ${g.group}`);
      for (const it of answered) lines.push(`- ${it.q}：${$(it.id).value.trim().replace(/\n+/g, ' ／ ')}`);
    }
    return lines.join('\n');
  }

  // タブ
  function showTab(which){
    const make = which === 'make';
    $('tab-make').setAttribute('aria-selected', make);
    $('tab-class').setAttribute('aria-selected', !make);
    $('form').hidden = !make;
    $('panel-class').hidden = make;
  }
  $('tab-make').addEventListener('click', () => showTab('make'));
  $('tab-class').addEventListener('click', () => showTab('class'));

  // ---------------------------------------------------------------------------
  // 保存：Claude のアカウントに保存して、どのブラウザで開いても同じ内容にする
  //（アカウントに保存できないときは、このブラウザにだけ保存）
  // ---------------------------------------------------------------------------
  const SETTING_IDS = ['s-title','s-title-en','s-class','s-grade','s-grade-max','s-issue','s-publisher','s-colname'];   // 発行日は保存せず、開いた日にする
  const DRAFT_IDS = ['in-school','in-world','in-other'];
  const SHARED_IDS = QUESTIONS.filter(g => g.shared).flatMap(g => g.items.map(it => it.id));
  const CLASS_IDS = () => [...SETTING_IDS, ...DRAFT_IDS, ...PROFILE_IDS.filter(id => !SHARED_IDS.includes(id))];
  const LOCAL_KEY = 'shinbun-app';

  // 新聞（クラス）ごとの内容。はじめて開いたときは、1年生のクラスとホームの2つを用意しておく
  const newClass = (name, f) => ({ id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, rubyFrom: 1, fields: f });
  let state = {
    current: null,
    shared: {},
    classes: [
      newClass('1年生のクラス', { 's-title': '1ねんせい しんぶん', 's-title-en': '', 's-class': '1年生', 's-grade': '1', 's-grade-max': '1', 's-issue': '1', 's-publisher': '担任', 's-colname': '先生のまど', 'p-size': '28人' }),
      newClass('ホーム（1〜5年生）', { 's-title': 'ホーム新聞', 's-title-en': '', 's-class': 'ホーム', 's-grade': '1', 's-grade-max': '5', 's-issue': '1', 's-publisher': '担任', 's-colname': '先生のまど', 'p-size': '30人（1〜5年生）' }),
    ],
    updatedAt: 0,
  };
  state.current = state.classes[0].id;
  const cur = () => state.classes.find(c => c.id === state.current) || state.classes[0];

  let cloudDoc = null;           // db のドキュメント（自分だけが読み書きできる場所）
  let dirty = false, writing = null, writeTimer = null;

  // 画面 → state（いま開いている新聞）
  function collect(){
    const c = cur();
    c.fields = {};
    for (const id of CLASS_IDS()) c.fields[id] = $(id).value;
    for (const id of SHARED_IDS) state.shared[id] = $(id).value;
    c.rubyFrom = rubyFrom;
    c.article = isSample ? null : article;
    return state;
  }
  // state → 画面
  function show(){
    const c = cur();
    for (const id of CLASS_IDS()) $(id).value = c.fields?.[id] ?? (id === 's-grade' || id === 's-grade-max' ? '1' : '');
    for (const id of SHARED_IDS) $(id).value = state.shared?.[id] ?? '';
    $('s-date').value = todayJa();
    if (!$('s-issue').value) $('s-issue').value = '1';
    rubyFrom = c.rubyFrom ?? 3;
    $('ruby-from').value = String(rubyFrom);
    if (c.article){ article = c.article; isSample = false; } else { article = SAMPLE; isSample = true; }
    showChecks([]); $('revise-box').hidden = isSample;
    $('cls').innerHTML = state.classes.map(k => `<option value="${k.id}"${k.id === c.id ? ' selected' : ''}>${esc(k.name)}</option>`).join('');
    $('cls-del').disabled = state.classes.length < 2;
    profileCount();
    render();
  }
  function adopt(o){
    if (!o) return false;
    if (o.classes && o.classes.length){ state = { shared: {}, ...o }; if (!cur()) state.current = state.classes[0].id; return true; }
    // 前の版（1つの新聞だけの形）から引っこし
    const f = o.fields || o, c = state.classes[0];
    c.fields = { ...c.fields }; for (const k in f) if (typeof f[k] === 'string') c.fields[k] = f[k];
    if (o.article) c.article = o.article;
    if (o.rubyFrom != null) c.rubyFrom = Number(o.rubyFrom);
    return true;
  }
  function setSync(t){ $('sync').textContent = t; $('sync2').textContent = t; }

  function load(){
    try { adopt(JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null')); } catch(e){}
  }
  function persist(){
    collect();
    state.updatedAt = Date.now();
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch(e){}
    if (!cloudDoc) return;
    dirty = true;
    setSync('保存中…');
    clearTimeout(writeTimer);
    writeTimer = setTimeout(flush, 1200);    // 打ち終わってから1回だけ書く
  }
  async function flush(){
    if (!cloudDoc || !dirty) return;
    if (writing){ await writing; return flush(); }
    dirty = false;
    writing = cloudDoc.set(JSON.parse(JSON.stringify(state)))
      .then(() => setSync('アカウントに保存しました（どのブラウザで開いても同じ内容になります）'))
      .catch(() => { dirty = true; setSync('アカウントに保存できませんでした。このブラウザには保存されています。'); })
      .finally(() => { writing = null; });
    await writing;
  }
  async function connectCloud(){
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude?.use ? window.claude.use('db') : null, window.claude?.use ? window.claude.use('user') : null]); } catch(e){}
    const uid = user ? await user.id().catch(() => null) : null;
    if (!db || !uid){ setSync('このブラウザにだけ保存しています。'); return; }
    cloudDoc = db.doc('data/users/' + uid + '/app');
    try {
      const snap = await cloudDoc.get();
      const remote = snap.exists ? snap.data() : null;
      if (remote && (remote.updatedAt || 0) >= (state.updatedAt || 0)){
        adopt(JSON.parse(JSON.stringify(remote))); show();
        try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); } catch(e){}
        setSync('アカウントに保存された内容を読みこみました（どのブラウザで開いても同じ内容になります）');
      } else {
        collect(); dirty = true; await flush();   // はじめて、またはこのブラウザの方が新しい
      }
    } catch(e){
      cloudDoc = null;
      setSync('アカウントに保存できないため、このブラウザにだけ保存しています。');
    }
  }
  // 別のブラウザで書きかえてから戻ってきたら、新しいほうを読みこむ
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !cloudDoc || dirty || writing) return;
    try {
      const snap = await cloudDoc.get();
      const remote = snap.exists ? snap.data() : null;
      if (remote && (remote.updatedAt || 0) > (state.updatedAt || 0)){ adopt(JSON.parse(JSON.stringify(remote))); show(); setSync('別のブラウザで書きかえた内容を読みこみました'); }
    } catch(e){}
  });
  window.addEventListener('pagehide', () => { if (dirty) flush(); });

  // 新聞の切りかえ・追加・削除
  $('cls').addEventListener('change', () => { collect(); state.current = $('cls').value; show(); persist(); });
  $('cls-add').addEventListener('click', () => {
    collect();
    const c = newClass('新しい新聞' + (state.classes.length + 1), { 's-title': '学級新聞', 's-grade': cur().fields['s-grade'] || '1', 's-grade-max': cur().fields['s-grade-max'] || '1', 's-issue': '1', 's-publisher': '担任', 's-colname': '先生のまど' });
    state.classes.push(c); state.current = c.id;
    show(); persist();
    showTab('make'); $('settings').open = true; $('s-title').focus();
  });
  $('cls-del').addEventListener('click', () => {
    $('cls-confirm-text').textContent = `「${cur().name}」の設定・メモ・クラスのことを消しますか？`;
    $('cls-confirm').hidden = false;
  });
  $('cls-del-no').addEventListener('click', () => { $('cls-confirm').hidden = true; });
  $('cls-del-yes').addEventListener('click', () => {
    $('cls-confirm').hidden = true;
    if (state.classes.length < 2) return;
    state.classes = state.classes.filter(c => c.id !== state.current);
    state.current = state.classes[0].id;
    show(); persist();
  });
  // 新聞の名前を変えたら、切りかえの一覧の名前もそろえる
  $('s-class').addEventListener('change', () => { const v = $('s-class').value.trim(); if (v){ cur().name = v; $('cls').selectedOptions[0].textContent = v; } });
  $('s-date').addEventListener('change', render);

        if (r.left < box.left - 1 || r.right > box.right + 1 || r.top < box.top - 1 || r.bottom > box.bottom + 1) return true;
      }
      return false;
    };

    for (let i = 0; i < 12; i++){

      el.style.fontSize = mid + 'pt';
      if (overflows()) hi = mid; else lo = mid;

# 書き方のきまり
- 事実を足さず、ことばを足す。
  - 学校のこと：メモにない出来事・人数・記録・日付・子どものせりふを作らない。足してよいのは、様子がうかぶ言いかえ、なぜ大事かの説明、読み手への問いかけ・よびかけ。
  - quote（大きく引用される言葉）は、メモにある子どもの言葉だけ。なければ空文字にする。
  - 世の中のニュース：日付・数字・固有名詞はメモに書かれたものだけ使う。一般的な背景説明（行事の由来、しくみ）は足してよい。自信のない事実は書かず、checks に書く。
  - 世の中のメモが空なら、発行日の季節の行事や自然の話題（暦・天体・生き物など、日付に左右されない一般的な知識）で書き、最近の出来事は書かない。checks に「話題はAIが選びました」と書く。
  - 事件・事故・災害・戦争など、子どもがこわがる話題はメモで明示されたときだけ、落ち着いて書く。
  - コラム：担任の一人称で、最後は読み手へのよびかけや問いで終える。メモになければ、季節や他の記事につながるテーマで書く。
- 「クラスの基礎知識」があれば参考にする。学級目標・係や活動の名前・行事の日付・学習中の単元は、そこに書かれたとおりに使ってよく、記事やクイズを授業や学級目標とつなげられるときは一言つなげる。ただし、基礎知識から今回の出来事を作らない（今回の出来事はメモに書かれたことだけ）。口調・読む人・使わない言葉の希望があれば必ず守る。
- 子どもの名前はフルネームで書かない（メモにあっても「〇〇さん」までか「ある人」にする）。
- 「です・ます」。一文は40字くらいまで。
- ふりがな・読みは書かない（あとで別につける）。{ } の記号は使わない。\n- ${st.grade}年生にむずかしい言葉は、やさしい言葉に言いかえる。${st.grade <= 2 ? 'ひらがなを多めにし、一文をとくに短く（30字くらいまで）、全体を2〜3割短くする。' : ''}
- 大事なところは **ことば** で傍点をつける（1記事に1〜2か所まで）。
- 数字は半角。予定の items は「9/28（月）｜全校朝会」のように、日付と内容を全角の｜で区切る。

# 分量（A4 1枚に収めるため、守ってください）
- school.headline 18字以内 / school.subhead 15字以内 / school.body 3段落で合計350〜420字
- world.headline 14字以内 / world.subhead 15字以内 / world.body 2〜3段落で合計260〜320字 / world.memo.body 1つで50字以内（むずかしい言葉がなければ空配列）
- column.headline 12字以内 / column.body 2段落で合計200〜240字

- boxes は2つ（メモに予定があれば「来週の予定」、なければ別の囲み。もう1つはクイズなど）。各60字以内、予定は4行まで。
- school.emoji は記事に合う絵文字1つ、school.caption は25字以内。

  let samplePromise = null, ctl = null;

  const RUN = /[\u4e00-\u9fff々〆]+/g;

  function stripRuby(obj){ return JSON.parse(JSON.stringify(obj).replace(/\{([^|{}]+)\|[^{}]+\}/g, '$1')); }

    const after = (str.slice(i + run.length).match(/^[\u3041-\u309f]{0,3}/) || [''])[0];
    return before + run + '|' + after;

    const plain = stripRuby(art);
    const items = new Map();   // key -> {run, context}
    eachString(plain, str => {

        if (!items.has(key)) items.set(key, {

    });

送りがなは入れず、【】の中の漢字の部分だけの読みにします（例：【見上】げる → みあ、【練習】 → れんしゅう、【10】【分】 のような時間なら ふん）。
{"1": "よみ", "2": "よみ", ...} の形の JSON だけを返してください。

${list}`, { signal, modelTier: 'default', cache: false });

  async function ask(extra){

      const data2 = article;
      const missing = rubyFrom ? missingRuby({ note: data2.note, school: data2.school, world: data2.world, column: data2.column, boxes: data2.boxes }) : [];
      showChecks([...checks, ...(missing.length ? [`ふりがながついていない漢字があります：${missing.join('、')}（紙面で直すか、「直したいこと」に「ふりがなをつけて」と書いてください）`] : [])]);
      $('revise-box').hidden = false;
      setStatus('できました。紙面を確かめて、よければ「印刷用ファイルを保存」を押してください。');
    } catch(e){
      setStatus(ERR[e?.code] || ('うまくいきませんでした（' + (e?.message || e?.code || 'エラー') + '）。もう一度押してください。'), e?.code !== 'cancelled');
    } finally {
      busy(false);
    }
  }
  function busy(on){
    $('go').disabled = on; $('revise').disabled = on; $('stop').hidden = !on;
  }
  function showChecks(list){
    const items = (list || []).filter(Boolean);
    $('checks').hidden = !items.length;
    $('checks').innerHTML = items.length ? '<b>確かめてほしいこと</b><ul>' + items.map(t => '<li>' + fmt(t) + '</li>').join('') + '</ul>' : '';
  }

  $('form').addEventListener('submit', e => { e.preventDefault(); ask(); });
  $('revise').addEventListener('click', () => { const t = $('in-revise').value.trim(); if (t) ask(t); else $('in-revise').focus(); });
  $('in-revise').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); $('revise').click(); } });
  $('stop').addEventListener('click', () => ctl?.abort());

  // 設定を変えたらすぐ紙面に反映（下書きは覚えておくだけ）
  for (const id of SETTING_IDS) $(id).addEventListener('change', () => { render(); persist(); });
  for (const id of DRAFT_IDS) $(id).addEventListener('input', persist);
  $('profile-fields').addEventListener('input', () => { profileCount(); persist(); });
  $('profile-fields').addEventListener('change', () => { profileCount(); persist(); });

  // 写真
  $('in-photo').addEventListener('change', () => {
    const f = $('in-photo').files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { photo = r.result; $('photo-clear').hidden = false; render(); };
    r.readAsDataURL(f);
  });
  $('photo-clear').addEventListener('click', () => { photo = null; $('in-photo').value = ''; $('photo-clear').hidden = true; render(); });

  // ふりがな（選びなおしたら組みなおす）
  $('ruby-from').addEventListener('change', () => { rubyFrom = Number($('ruby-from').value); render(); persist(); });

  // ---------------------------------------------------------------------------
  // 印刷用ファイル：開くと自動で印刷画面が出る HTML
  // ---------------------------------------------------------------------------
  function exportHtml(){
    const clone = page.cloneNode(true);
    clone.querySelectorAll('[contenteditable]').forEach(el => { el.removeAttribute('contenteditable'); el.removeAttribute('spellcheck'); });
    const css = $('paper-css').textContent;
    const fonts = document.querySelector('link[rel=stylesheet]').outerHTML;
    const st = settings();
    const title = `${st.title} 第${st.issue}号`;
    return `<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(title)}</title>
${fonts}
<style>${css}
@page{ size:A4 portrait; margin:0; }
html,body{ margin:0; }
body{ background:#9a978f; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.page{ margin:16px auto; }
@media print{ body{ background:none; } .page{ margin:0; box-shadow:none; } }
</style></head>
<body>
<main class="page">${clone.innerHTML}</main>
<script>
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function(){ setTimeout(function(){ window.print(); }, 400); });
<\/script>
</body></html>`;
  }
  $('save').addEventListener('click', async () => {
    const btn = $('save');
    let downloads = null;
    try { downloads = window.claude?.use ? await window.claude.use('downloads') : null; } catch(e){}
    if (!downloads){ setStatus('このページではファイルを保存できません。claude.ai で開いてください。', true); return; }
    const st = settings();
    const name = `${st.title}_第${st.issue}号.html`.replace(/[\\/:*?"<>|]/g, '');
    btn.disabled = true;
    try {
      await downloads.save({ filename: name, data: exportHtml() });
      setStatus('保存しました。ファイルを開くと印刷画面が出ます（用紙はA4、余白なし・背景のグラフィックをオンにするときれいです）。');
    } catch(e){
      if (e?.code === 'declined') setStatus('保存をやめました。');
      else if (e?.code === 'rate_limited') setStatus('少し待ってからもう一度押してください。', true);
      else setStatus('保存できませんでした（' + (e?.code || 'エラー') + '）。', true);
    } finally { btn.disabled = false; }
  });

  // ---------------------------------------------------------------------------
  buildQuestions();
  load();
  show();
  if (document.fonts) document.fonts.ready.then(render);
  connectCloud();
})();
</script>
