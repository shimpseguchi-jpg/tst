<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>商店街連作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600&family=Noto+Serif+JP:wght@400;500&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#e8e9e3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131513" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="商店街">
<style>
:root{
  --ground:#e8e9e3; --surface:#f5f5f1; --sunk:#dedfd7;
  --ink:#191b19; --ink-soft:#4a4f4b; --muted:#71776f;
  --rule:#cccec4; --rule-soft:#dcded4;
  --accent:#9c382c; --accent-soft:#b9705f; --mark:#e4dcc8;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --util:ui-sans-serif,system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;
  --fs:17px; --lh:1.95;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131513; --surface:#1b1e1b; --sunk:#0d0f0d;
    --ink:#dbdcd3; --ink-soft:#b3b6ac; --muted:#858b81;
    --rule:#2c302c; --rule-soft:#232723;
    --accent:#c9685a; --accent-soft:#a8564a; --mark:#3a3324;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#131513; --surface:#1b1e1b; --sunk:#0d0f0d;
  --ink:#dbdcd3; --ink-soft:#b3b6ac; --muted:#858b81;
  --rule:#2c302c; --rule-soft:#232723;
  --accent:#c9685a; --accent-soft:#a8564a; --mark:#3a3324;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.num{font-family:var(--util);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
#library[hidden],#reader[hidden]{display:none!important}

/* ---------- library ---------- */
#library{flex:1;overflow-y:auto;overflow-x:hidden}
.lib-inner{max-width:62rem;margin:0 auto;padding:0 16px;padding-block:clamp(2.5rem,7vw,5rem) 4rem}
.masthead{border-bottom:1px solid var(--rule);padding-bottom:1.6rem;margin-bottom:.4rem}
.masthead h1{
  font-family:var(--mincho);font-weight:600;margin:0;
  font-size:clamp(2rem,6vw,3.1rem);letter-spacing:.14em;text-wrap:balance;line-height:1.3;
}
.masthead .sub{
  margin:.9rem 0 0;color:var(--muted);font-family:var(--body);
  font-size:.92rem;line-height:1.9;max-width:34rem;
}
.tally{
  display:flex;flex-wrap:wrap;gap:0 1.6rem;margin-top:1.1rem;
  font-family:var(--util);font-size:.74rem;letter-spacing:.1em;color:var(--muted);
}
.tally b{font-weight:500;color:var(--ink-soft)}

.works{list-style:none;margin:0;padding:0}
.work{border-bottom:1px solid var(--rule-soft)}
.work>button{
  display:grid;grid-template-columns:3.2rem 1fr;gap:0 1.4rem;
  width:100%;text-align:left;padding:1.7rem 0;align-items:start;
}
.work>button:hover .wt,.work>button:focus-visible .wt{color:var(--accent)}
.wnum{
  font-family:var(--util);font-size:.78rem;letter-spacing:.08em;color:var(--muted);
  padding-top:.5rem;font-variant-numeric:tabular-nums;
}
.wt{font-family:var(--mincho);font-size:1.45rem;font-weight:600;letter-spacing:.09em;line-height:1.5;transition:color .15s}
.wgenre{
  display:inline-block;margin-right:.8rem;font-family:var(--util);
  font-size:.68rem;letter-spacing:.12em;color:var(--accent);
  border:1px solid currentColor;border-radius:1px;padding:.2rem .45rem;vertical-align:.18em;
}
.wblurb{margin:.7rem 0 0;color:var(--ink-soft);font-size:.9rem;line-height:1.95;max-width:38rem}
.wmeta{margin-top:.75rem;font-family:var(--util);font-size:.72rem;letter-spacing:.09em;color:var(--muted)}
.wmeta .dot{margin:0 .55rem;opacity:.5}
.wmeta .mark{color:var(--accent)}
.colophon{
  margin-top:3rem;padding-top:1.4rem;border-top:1px solid var(--rule);
  font-family:var(--util);font-size:.72rem;line-height:2.1;color:var(--muted);letter-spacing:.06em;
}

/* ---------- reader ---------- */
#reader{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.bar{
  display:flex;align-items:center;gap:.55rem;
  padding:.55rem 12px;border-bottom:1px solid var(--rule);
  background:var(--surface);flex:none;min-height:3rem;
}
.bar .spacer{flex:1;min-width:0}
.crumb{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumb .w{font-family:var(--mincho);font-size:.95rem;letter-spacing:.08em;font-weight:600}
.crumb .c{font-family:var(--util);font-size:.7rem;letter-spacing:.1em;color:var(--muted);margin-left:.7rem}
.btn{
  font-family:var(--util);font-size:.72rem;letter-spacing:.1em;color:var(--ink-soft);
  border:1px solid var(--rule);border-radius:2px;padding:.4rem .6rem;white-space:nowrap;
  transition:border-color .15s,color .15s;
}
.btn:hover{color:var(--accent);border-color:var(--accent-soft)}
.btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent-soft);background:var(--sunk)}
.btn.ghost{border-color:transparent;padding:.4rem .35rem}
.btn.ghost:hover{border-color:var(--rule)}

/* stage */
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
.pane{
  position:absolute;inset:0;padding:clamp(1.8rem,4vw,3rem) clamp(1rem,4vw,3rem);
}
body.tate .pane{
  writing-mode:vertical-rl;
  overflow-x:auto;overflow-y:hidden;
}
body.yoko .pane{overflow-y:auto;overflow-x:hidden}
.text{
  font-size:var(--fs);line-height:var(--lh);letter-spacing:.055em;
  color:var(--ink);font-feature-settings:"palt" 0;
}
body.tate .text{height:100%;max-height:100%}
body.yoko .text{max-width:36rem;margin:0 auto}
.text p{margin:0;text-indent:0}
.chead{font-family:var(--mincho);font-weight:600;letter-spacing:.2em;color:var(--ink)}
body.tate .chead{
  font-size:1.25em;margin:0 0 3.2em 0;padding:0 0 0 .2em;
  border-right:1px solid var(--rule);padding-right:1.4em;
}
body.yoko .chead{font-size:1.3em;margin:0 0 2.6em;padding-bottom:.9em;border-bottom:1px solid var(--rule)}
.scene+.scene{margin:0}
body.tate .scene+.scene{margin-left:2.6em}
body.yoko .scene+.scene{margin-top:2.4em}
body.tate .endmark{margin-left:3em;color:var(--muted);font-size:.8em;letter-spacing:.3em}
body.yoko .endmark{margin-top:2.4em;color:var(--muted);font-size:.8em;letter-spacing:.3em;text-align:right}

/* footer */
.foot{
  display:flex;align-items:center;gap:.5rem;flex:none;
  padding:.5rem 12px;padding-bottom:calc(.5rem + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--rule);background:var(--surface);
}
.prog{flex:1;min-width:0;display:flex;align-items:center;gap:.7rem}
.track{flex:1;height:2px;background:var(--rule);position:relative;overflow:hidden;border-radius:2px}
.fill{position:absolute;top:0;bottom:0;width:0;background:var(--accent);transition:width .18s}
body.tate .fill{right:0;left:auto}
body.yoko .fill{left:0;right:auto}
body.tate .foot{flex-direction:row-reverse}
.pct{font-family:var(--util);font-size:.68rem;letter-spacing:.08em;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.2rem;text-align:right}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{
  position:fixed;z-index:21;top:0;bottom:0;right:0;width:min(23rem,88vw);
  background:var(--surface);border-left:1px solid var(--rule);
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.dhead{display:flex;align-items:center;gap:.5rem;padding:.9rem 1.1rem;border-bottom:1px solid var(--rule);flex:none}
.dhead h2{margin:0;font-family:var(--mincho);font-size:1rem;letter-spacing:.16em;font-weight:600;flex:1}
.dbody{overflow-y:auto;padding:.5rem 0 2rem}
.dwork{font-family:var(--util);font-size:.68rem;letter-spacing:.14em;color:var(--muted);padding:1.2rem 1.1rem .5rem}
.chap{
  display:flex;gap:.85rem;align-items:baseline;width:100%;text-align:left;
  padding:.62rem 1.1rem;border-left:2px solid transparent;
}
.chap:hover{background:var(--sunk)}
.chap[aria-current="true"]{border-left-color:var(--accent);background:var(--sunk)}
.chap[aria-current="true"] .ct{color:var(--accent)}
.ci{font-family:var(--util);font-size:.68rem;color:var(--muted);min-width:1.4rem;font-variant-numeric:tabular-nums}
.ct{flex:1;font-family:var(--mincho);font-size:.92rem;letter-spacing:.07em;line-height:1.6}
.cn{font-family:var(--util);font-size:.64rem;color:var(--muted);font-variant-numeric:tabular-nums}
.backline{padding:.9rem 1.1rem;border-top:1px solid var(--rule);flex:none}

/* zen (fullscreen reading) */
body.zen .bar,body.zen .foot{display:none}
body.zen #reader{background:var(--ground)}
.zenbar{
  position:absolute;z-index:5;top:0;left:0;right:0;height:2px;background:var(--rule);
  display:none;
}
body.zen .zenbar{display:block}
.zenbar .fill2{position:absolute;top:0;bottom:0;width:0;background:var(--accent);transition:width .18s}
body.tate .zenbar .fill2{right:0;left:auto}
body.yoko .zenbar .fill2{left:0;right:auto}
.zenout{
  position:absolute;z-index:6;top:calc(.7rem + env(safe-area-inset-top,0px));right:.8rem;display:none;
  font-family:var(--util);font-size:.68rem;letter-spacing:.1em;color:var(--muted);
  border:1px solid var(--rule);border-radius:2px;padding:.35rem .55rem;
  background:var(--ground);opacity:.5;transition:opacity .15s;
}
body.zen .zenout{display:block}
.zenout:hover,.zenout:focus-visible{opacity:1;color:var(--accent);border-color:var(--accent-soft)}

.loading{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--util);font-size:.75rem;letter-spacing:.2em;color:var(--muted);
}
/* ---------- guide ---------- */
#guide{flex:1;overflow-y:auto;overflow-x:hidden}
.g-inner{max-width:60rem;margin:0 auto;padding:0 16px;padding-block:2rem 4rem}
.g-inner.wide{max-width:90rem}
.g-top{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:1.1rem}
.g-top h1{font-family:var(--mincho);font-weight:600;font-size:clamp(1.5rem,4vw,2.1rem);letter-spacing:.14em;margin:0;flex:1}
.tabs{display:flex;gap:.4rem;margin:1.4rem 0 .4rem;flex-wrap:wrap}
.tab{
  font-family:var(--util);font-size:.74rem;letter-spacing:.12em;color:var(--muted);
  border:1px solid var(--rule);border-radius:2px;padding:.45rem .85rem;
}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent-soft);background:var(--surface)}
.gsec{padding-top:1.4rem}
.gsec h2{
  font-family:var(--util);font-size:.7rem;letter-spacing:.2em;color:var(--muted);font-weight:400;
  margin:2.2rem 0 .2rem;padding-bottom:.5rem;border-bottom:1px solid var(--rule-soft);
}
.gsec h2:first-child{margin-top:.6rem}
.chips{display:inline-flex;flex-wrap:wrap;gap:.25rem;vertical-align:.1em}
.chip{
  font-family:var(--util);font-size:.6rem;letter-spacing:.04em;line-height:1;
  border:1px solid var(--rule);color:var(--muted);border-radius:1px;padding:.22rem .3rem;
  font-variant-numeric:tabular-nums;
}
.chip.lead{border-color:var(--accent);color:var(--accent)}
.ent{padding:1.15rem 0;border-bottom:1px solid var(--rule-soft)}
.ent .hd{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
.ent .nm{font-family:var(--mincho);font-size:1.12rem;font-weight:600;letter-spacing:.09em}
.ent .yo{font-family:var(--util);font-size:.68rem;color:var(--muted);letter-spacing:.06em}
.ent .rl{font-family:var(--util);font-size:.7rem;color:var(--ink-soft);letter-spacing:.06em}
.ent .ag{font-family:var(--util);font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ent .ds{margin:.6rem 0 0;font-size:.88rem;line-height:1.95;color:var(--ink-soft);max-width:44rem}
.ent .nt{
  margin:.55rem 0 0;font-size:.79rem;line-height:1.9;color:var(--muted);max-width:44rem;
  padding-left:.8rem;border-left:2px solid var(--rule);
}
.shoprow{display:grid;grid-template-columns:2.2rem 1fr;gap:0 1rem;padding:1.05rem 0;border-bottom:1px solid var(--rule-soft)}
.shoprow .pin{font-family:var(--util);font-size:.68rem;color:var(--muted);padding-top:.35rem;font-variant-numeric:tabular-nums}
.shoprow .st{font-family:var(--util);font-size:.68rem;letter-spacing:.06em;color:var(--muted)}
.shoprow .st.gone{color:var(--accent)}
.yr{margin-top:2.4rem}
.yr>h3{
  font-family:var(--mincho);font-size:1.35rem;font-weight:600;letter-spacing:.18em;margin:0 0 .3rem;
  padding-bottom:.5rem;border-bottom:1px solid var(--rule);
}
.evt{display:grid;grid-template-columns:6.5rem 2.4rem 1fr;gap:0 .9rem;padding:.7rem 0;border-bottom:1px solid var(--rule-soft);align-items:baseline}
.evt .mo{font-family:var(--util);font-size:.72rem;color:var(--muted);letter-spacing:.05em}
.evt .tx{font-size:.88rem;line-height:1.85;color:var(--ink-soft)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:0 1.8rem;margin-top:.4rem}
.fact{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--rule-soft);font-size:.84rem}
.fact b{font-weight:400;color:var(--muted);font-family:var(--util);font-size:.72rem;letter-spacing:.08em;white-space:nowrap}
.fact span{color:var(--ink-soft);text-align:right}
.spoil{
  margin:1rem 0 0;font-family:var(--util);font-size:.7rem;letter-spacing:.08em;
  color:var(--muted);border-left:2px solid var(--accent);padding-left:.8rem;line-height:1.9;
}
/* 人物のサムネと詳細 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.4rem,1fr));gap:.7rem;margin:.5rem 0 .2rem}
.pcard{
  display:flex;flex-direction:column;gap:.45rem;text-align:left;width:100%;
  padding:.85rem .85rem .9rem;border:1px solid var(--rule);background:var(--surface);
  cursor:pointer;transition:border-color .15s,transform .15s;
}
.pcard:hover{border-color:var(--accent)}
.pcard:active{transform:scale(.985)}
.pcard .gl{
  font-family:var(--mincho);font-size:2rem;line-height:1;font-weight:600;
  color:var(--ink);opacity:.9;letter-spacing:0;
}
.pcard .pn{font-family:var(--mincho);font-size:.98rem;font-weight:600;letter-spacing:.06em;line-height:1.4}
.pcard .py{font-family:var(--util);font-size:.63rem;color:var(--muted);letter-spacing:.05em}
.pcard .pr{font-family:var(--util);font-size:.66rem;color:var(--ink-soft);line-height:1.6}
.pcard .chips{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.15rem}
.pcard.isLead .gl{color:var(--accent)}
/* 一枚絵。無い人は下のグリフがそのまま見える */
.pcard .pic{
  position:relative;width:100%;aspect-ratio:4/5;margin-bottom:.2rem;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:var(--sunk);
}
.pcard .pic .gl{font-size:2.6rem;opacity:.75}
.pcard .pimg{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 50%;
}
/* 鉛筆画は紙が白い。暗いほうでそのまま出すと浮くので、少し落とす */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .pimg,
  :root:not([data-theme="light"]) .pshot img{filter:brightness(.8) contrast(1.06)}
}
:root[data-theme="dark"] .pimg,
:root[data-theme="dark"] .pshot img{filter:brightness(.8) contrast(1.06)}
.pcard .pimg.dead{display:none}
/* 詳細 */
.psheet{
  position:fixed;z-index:31;inset:0;display:flex;justify-content:center;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  pointer-events:none;
}
.psheet .pbox{
  pointer-events:auto;width:min(42rem,100%);background:var(--surface);
  border-left:1px solid var(--rule);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;animation:pup .2s ease;
  max-height:100%;min-height:0;
}
@keyframes pup{from{opacity:0;transform:translateY(1.2rem)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:center;gap:.6rem;padding:.9rem 1.2rem;border-bottom:1px solid var(--rule);flex:none}
.phead .t{font-family:var(--mincho);font-size:1.05rem;font-weight:600;letter-spacing:.1em;flex:1}
.pbody{
  /* 縦並びの flex 項目は min-height:auto のままだと縮まず、
     中身の高さのまま伸びて overflow-y が働かない。min-height:0 が要る */
  flex:1 1 auto;min-height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:1.4rem 1.2rem 3rem;
}
.pbody .pshot{
  margin:-1.4rem -1.2rem 1.4rem;background:var(--sunk);
  border-bottom:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;
}
.pbody .pshot img{display:block;max-width:100%;max-height:56vh}
.pbody .pshot.dead{display:none}
.pbody .big{font-family:var(--mincho);font-size:1.75rem;font-weight:600;letter-spacing:.12em;line-height:1.4;margin:0}
.pbody .sub{font-family:var(--util);font-size:.72rem;color:var(--muted);letter-spacing:.06em;margin:.35rem 0 0;line-height:1.9}
.pbody .rl2{font-family:var(--util);font-size:.76rem;color:var(--ink-soft);letter-spacing:.05em;margin:.15rem 0 .7rem}
.pbody .rl2.gone{color:var(--accent)}
.pfield{margin-top:1.5rem}
.pfield>h4{
  margin:0 0 .4rem;font-family:var(--util);font-size:.66rem;letter-spacing:.2em;font-weight:400;
  color:var(--muted);border-bottom:1px solid var(--rule-soft);padding-bottom:.35rem;
}
.pfield>p{margin:0;font-size:.88rem;line-height:1.95;color:var(--ink-soft)}
.psee{padding:.55rem 0;border-bottom:1px solid var(--rule-soft)}
.psee .who{font-family:var(--mincho);font-size:.85rem;letter-spacing:.06em;color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
.psee .who.link{color:var(--accent);text-decoration:underline;text-underline-offset:.2em}
.psee p{margin:.25rem 0 0;font-size:.85rem;line-height:1.9;color:var(--ink-soft)}
.pseed{
  margin-top:1.6rem;padding:.9rem 1rem;border:1px dashed var(--rule);background:var(--sunk);
}
.pseed h4{margin:0 0 .4rem;font-family:var(--util);font-size:.66rem;letter-spacing:.2em;font-weight:400;color:var(--accent)}
.pseed p{margin:0;font-size:.84rem;line-height:1.95;color:var(--ink-soft)}
.pcard .pin2{
  font-family:var(--util);font-size:.63rem;color:var(--muted);letter-spacing:.08em;
  font-variant-numeric:tabular-nums;
}
.pcard .pst{font-family:var(--util);font-size:.63rem;color:var(--muted);letter-spacing:.05em;line-height:1.5}
.pcard .pst.gone{color:var(--accent)}
.pcard.isGone .gl{opacity:.38}
.pmenu{margin-top:.1rem}
.mrow{display:grid;grid-template-columns:1fr auto;gap:.2rem .9rem;padding:.6rem 0;border-bottom:1px solid var(--rule-soft)}
.mrow .mn{font-family:var(--mincho);font-size:.92rem;letter-spacing:.04em}
.mrow .mp{font-family:var(--util);font-size:.78rem;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.mrow .mc{grid-column:1/-1;margin:0;font-size:.8rem;line-height:1.85;color:var(--muted)}
/* 紙面　寸法は 資料/備陽新報_紙面規格.md による。一ページ十五段、一段四十七行、一行十一字 */
.paperwrap{margin:1rem 0 0;overflow:hidden}
.paper{
  width:1240px;height:2500px;position:relative;transform-origin:top left;
  background:#f3f1e9;color:#1b1a16;border:1px solid #c9c6b8;
  font-family:var(--mincho);
}
.paper *{box-sizing:border-box}
.pgtop{position:absolute;left:24px;right:24px;top:24px;height:64px;border-bottom:3px double #1b1a16;
  display:flex;align-items:center;gap:18px}
.pgtop .pno{font-family:var(--util);font-size:22px;font-weight:600;letter-spacing:.05em}
.pgtop .psec{font-size:20px;letter-spacing:.35em;border-left:1px solid #1b1a16;padding-left:16px}
.pgtop .sp{flex:1}
.pgtop .pdate{font-family:var(--util);font-size:15px;letter-spacing:.06em}
.pgtop .ptitle{font-size:26px;letter-spacing:.4em;font-weight:600}

/* 主記事。段一〜七 */
.pphoto{position:absolute;display:flex;flex-direction:column}
.pphoto .fr{flex:1;border:1px solid #b9b6a8;background:#e7e4da;overflow:hidden}
.pphoto .cap{font-size:13px;letter-spacing:.03em;padding-top:5px;color:#3d3b33}
.phcol{position:absolute;writing-mode:vertical-rl;border-left:1px solid #b9b6a8;padding-left:12px}
.phcol .ser{font-size:15px;letter-spacing:.3em;color:#7a2018;margin-left:10px}
.phcol .big{font-size:52px;font-weight:600;letter-spacing:.2em;line-height:1.12;margin-left:12px}
.phcol .sub2{font-size:19px;letter-spacing:.18em;color:#3d3b33;margin-left:8px;
  border-right:1px solid #b9b6a8;padding-right:10px}
.dan{position:absolute;writing-mode:vertical-rl;font-size:13px;line-height:1.95;
  letter-spacing:.02em;overflow:hidden}
.dan p{margin:0;text-indent:1em}
.dan p.by{text-indent:0;margin-right:1.2em;color:#3d3b33}
.pinset{position:absolute;display:none;writing-mode:vertical-rl;
  border:1px solid #b9b6a8;background:#ece9df;padding:12px 10px;font-size:13px;line-height:1.95}
.pinset .it{font-size:15px;letter-spacing:.25em;margin-left:10px;
  border-left:1px solid #c9c6b8;padding-left:10px}
.pinset ul{list-style:none;margin:0;padding:0}
.pinset li{margin:0 0 .6em 0;letter-spacing:.02em}
.pinset .ft{font-size:11px;color:#5a574c;letter-spacing:.1em;margin-left:6px}
.danrule{position:absolute;border-top:1px solid #9d9a8c}

/* 段八〜十五 */
.nhead{position:absolute;writing-mode:vertical-rl;overflow:hidden;
  font-size:23px;font-weight:600;letter-spacing:.12em;line-height:1.25;
  border-left:1px solid #b9b6a8;padding-left:10px}
.nhead .s{font-size:14px;font-weight:400;letter-spacing:.08em;color:#3d3b33}
.dan.nd{font-size:13px;line-height:1.9}
.pgbox{position:absolute;border:1px solid #b9b6a8;padding:8px 10px;background:#efece2;overflow:hidden}
.pgbox .t{font-size:14px;letter-spacing:.2em;border-bottom:1px solid #c9c6b8;padding-bottom:4px;margin-bottom:6px}
.pwx{display:flex;align-items:center;gap:12px;font-family:var(--util);font-size:13px;line-height:1.6}
.pwx .tm{font-size:22px}
.pwx .hi{color:#7a2018}
.pobit{font-size:11.5px;line-height:1.7;margin:0 0 5px;text-indent:-1em;padding-left:1em}
.pad{position:absolute;border:1px solid #9d9a8c;background:#eeebe1;padding:8px 10px;
  display:flex;flex-direction:column;justify-content:center;text-align:center}
.pad .m{font-size:25px;font-weight:600;letter-spacing:.08em;line-height:1.25}
.pad.small .m{font-size:19px}
.pad .s{font-size:14px;letter-spacing:.05em;margin-top:5px;color:#7a2018}
.pad .x{font-family:var(--util);font-size:11.5px;letter-spacing:.03em;margin-top:6px;color:#4a4840;line-height:1.65}
.pad .ad{font-family:var(--util);font-size:10px;letter-spacing:.3em;color:#8b8878;margin-bottom:4px}
.paperbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.2rem 0 0}
.papernote{font-family:var(--util);font-size:.68rem;letter-spacing:.06em;color:var(--muted);margin:.5rem 0 0;line-height:1.9}
/* 報告書 */
.doc{max-width:44rem;margin:0 auto;padding-top:1rem}
.doc-head{border:1px solid var(--rule);background:var(--surface);padding:1.3rem 1.4rem;margin-bottom:2.2rem}
.doc-head .t{font-family:var(--mincho);font-size:1.35rem;font-weight:600;letter-spacing:.12em;line-height:1.5;margin:0 0 1rem;text-wrap:balance}
.doc-head dl{display:grid;grid-template-columns:4.5rem 1fr;gap:.35rem .9rem;margin:0;
  font-family:var(--util);font-size:.76rem;line-height:1.8;color:var(--ink-soft)}
.doc-head dt{color:var(--muted);letter-spacing:.14em}
.doc-head dd{margin:0}
.doc-note{margin:1rem 0 0;padding-top:.9rem;border-top:1px solid var(--rule-soft);
  font-family:var(--util);font-size:.72rem;line-height:1.95;color:var(--muted)}
.doc h2{font-family:var(--mincho);font-size:1.18rem;font-weight:600;letter-spacing:.1em;color:var(--ink);
  margin:3rem 0 .2rem;padding-bottom:.6rem;border-bottom:1px solid var(--rule);text-transform:none}
.doc h2:first-child{margin-top:0}
.doc h3{font-family:var(--mincho);font-size:1rem;font-weight:600;letter-spacing:.09em;color:var(--ink);
  margin:2.1rem 0 .1rem;padding-left:.7rem;border-left:3px solid var(--accent)}
.doc h4{font-family:var(--util);font-size:.78rem;letter-spacing:.14em;color:var(--muted);margin:1.6rem 0 0}
.doc p{margin:1.05rem 0 0;font-size:.92rem;line-height:2.05;color:var(--ink-soft)}
.doc strong{font-weight:500;color:var(--ink);background:linear-gradient(transparent 62%,var(--mark) 62%)}
.doc ul,.doc ol{margin:1rem 0 0;padding-left:1.3rem}
.doc li{font-size:.9rem;line-height:1.95;color:var(--ink-soft);margin-bottom:.45rem}
.doc a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--rule);word-break:break-all;font-size:.82em}
.doc a:hover{border-bottom-color:var(--accent)}
.doc hr{border:0;border-top:1px solid var(--rule-soft);margin:2.6rem 0 0}
.doc .tw{overflow-x:auto;margin:1.3rem 0 .3rem;border:1px solid var(--rule)}
.doc table{border-collapse:collapse;width:100%;font-size:.84rem;background:var(--surface)}
.doc th,.doc td{padding:.6rem .8rem;text-align:left;border-bottom:1px solid var(--rule-soft);vertical-align:top}
.doc th{font-family:var(--util);font-size:.72rem;letter-spacing:.08em;color:var(--muted);font-weight:400;
  background:var(--sunk);white-space:nowrap}
.doc td{color:var(--ink-soft);font-variant-numeric:tabular-nums}
.doc tbody tr:last-child td{border-bottom:0}
.doc td strong{background:none;color:var(--accent);font-weight:500}

@media (max-width:560px){
  .doc-head{padding:1.1rem}
  .doc-head dl{grid-template-columns:3.8rem 1fr}
  .doc h2{font-size:1.08rem}
  .evt{grid-template-columns:5.2rem 2.2rem 1fr;gap:0 .6rem}
  .shoprow{grid-template-columns:1.8rem 1fr;gap:0 .7rem}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media (max-width:560px){
  .work>button{grid-template-columns:2.4rem 1fr;gap:0 .9rem}
  .wt{font-size:1.28rem}
  .hide-sm{display:none}
  .btn{padding:.4rem .45rem}
}
</style>

<div id="app">
  <div id="library">
    <div class="lib-inner">
      <header class="masthead">
        <h1>商店街連作</h1>
        <p class="sub">新潟の羽室銀座と、広島の柏尾銀天街。二つのアーケード街を舞台に、二〇二六年から二〇三三年までを共有する十二篇と、四つの幕間。どこから読んでも、続けて読んでも成立します。</p>
        <div class="tally">
          <span><b class="num" id="t-works">—</b> 篇</span>
          <span><b class="num" id="t-chaps">—</b> 章</span>
          <span><b class="num" id="t-chars">—</b> 字</span>
        </div>
      </header>
      <ul class="works" id="works"></ul>
      <div class="colophon">
        <p style="margin:0 0 1.1rem"><button class="btn" id="toGuide">人物・店・年表の資料を見る</button> <button class="btn" id="toReport">森岡レポート</button> <button class="btn" id="toPaper">備陽新報の紙面</button> <button class="btn" id="installBtn" hidden>ホーム画面に追加</button></p>
        本文は縦書きで表示しています。横組みに切り替えることもできます。<br>
        字数は見出しと空白を除いた本文の文字数です。<br>
        読んだ位置はこの端末に記憶され、次に開いたときに続きから始まります。<br>
        <span id="offlineNote" hidden>一度開いた本文は端末に保存され、圏外でも読めます。</span>
      </div>
    </div>
  </div>

  <div id="guide" hidden>
    <div class="g-inner">
      <div class="g-top">
        <h1>資料</h1>
        <button class="btn" id="gBack">作品一覧へ</button>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="people" aria-selected="true">人物</button>
        <button class="tab" role="tab" data-tab="shops" aria-selected="false">店</button>
        <button class="tab" role="tab" data-tab="years" aria-selected="false">年表</button>

      <span class="spacer"></span>

        <div class="track"><div class="fill" id="fill"></div></div>

    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var KAN = "〇一二三四五六七八九十";
  function kan(n){
    if(n<=10) return n===10?"十":KAN[n];
    if(n<20) return "十"+KAN[n-10];
    var t=Math.floor(n/10), o=n%10;
    return KAN[t]+"十"+(o?KAN[o]:"");
  }
  function comma(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,","); }

  var store = {
    get:function(k,d){ try{ var v=localStorage.getItem("shotengai:"+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
    set:function(k,v){ try{ localStorage.setItem("shotengai:"+k,JSON.stringify(v)); }catch(e){} }
  };

  var $ = function(id){ return document.getElementById(id); };
  var index=[], cache={}, cur=null, curCh=0, drawer=null;
  var SIZES=[15,17,19,22], sizeIdx=store.get("size",1);
  var tate=store.get("tate",true);

  function applyMode(){
    document.body.classList.toggle("tate",tate);
    document.body.classList.toggle("yoko",!tate);
    $("tateBtn").textContent = tate?"縦":"横";
    $("tateBtn").setAttribute("aria-pressed", tate?"true":"false");
    document.documentElement.style.setProperty("--fs", SIZES[sizeIdx]+"px");
  }

  /* ---------- library ---------- */
  function renderLibrary(){
    var chaps=0, chars=0;
    var ul=$("works"); ul.textContent="";
    index.forEach(function(w,i){
      chaps+=w.count; chars+=w.chars;
      var pos=store.get("pos:"+w.num,null);
      var li=document.createElement("li"); li.className="work";
      var b=document.createElement("button");
      b.innerHTML =
        '<span class="wnum">'+w.num+'</span>'+
        '<span><span class="wt">'+w.title+'</span><br>'+
        '<span class="wgenre">'+w.genre+'</span>'+
        '<span class="wblurb">'+w.blurb+'</span>'+
        '<span class="wmeta"><span class="num">'+w.count+'</span>章'+
        '<span class="dot">／</span><span class="num">'+comma(w.chars)+'</span>字'+
        (pos?'<span class="dot">／</span><span class="mark">第'+kan(pos.ch+1)+'章まで読了</span>':'')+
        '</span></span>';
      b.addEventListener("click",function(){ open(w.num, pos?pos.ch:0); });
      li.appendChild(b); ul.appendChild(li);
    });
    $("t-works").textContent=index.length;
    $("t-chaps").textContent=chaps;
    $("t-chars").textContent=comma(chars);
  }

  /* ---------- scroll helpers (vertical-rl safe) ---------- */
  /* In writing-mode:vertical-rl the first column sits at the right edge.
     Browsers report that origin either as scrollLeft 0 (going negative toward
     the end) or as scrollLeft max. Probe once; never during a scroll. */
  var NEG=null;
  function originNeg(el){
    if(NEG===null){
      var prev=el.scrollLeft; el.scrollLeft=-1;
      NEG=el.scrollLeft<0; el.scrollLeft=prev;
    }
    return NEG;
  }
  function begin(el){
    return originNeg(el) ? 0 : (el.scrollWidth-el.clientWidth);
  }
  function toStart(el){
    if(tate) el.scrollLeft=begin(el); else el.scrollTop=0;
  }
  function progress(el){
    var span = tate ? (el.scrollWidth-el.clientWidth) : (el.scrollHeight-el.clientHeight);
    if(span<=0) return 0;
    var p = tate ? (begin(el)-el.scrollLeft)/span : el.scrollTop/span;
    return Math.max(0,Math.min(1,p));
  }
  function page(dir){ /* dir:1 forward, -1 back */
    var el=$("pane");
    if(tate) el.scrollBy({left: -dir*(el.clientWidth-40), behavior:"smooth"});
    else el.scrollBy({top: dir*(el.clientHeight-60), behavior:"smooth"});
  }

  /* ---------- reader ---------- */
  function open(num, ch){
    $("library").hidden=true; $("guide").hidden=true; $("reader").hidden=false;
    if(cache[num]){ show(cache[num],ch); return; }
    $("loading").hidden=false; $("pane").textContent="";
    fetch("data/"+num+".json").then(function(r){ return r.json(); }).then(function(w){
      cache[num]=w; $("loading").hidden=true; show(w,ch);
    }).catch(function(){
      $("loading").textContent="本文を読み込めませんでした";
    });
  }

  function show(w, ch){
    cur=w; curCh=Math.max(0,Math.min(w.chapters.length-1, ch||0));
    var c=w.chapters[curCh];
    $("cw").textContent=w.title;
    $("cc").textContent="第"+kan(curCh+1)+"章 ／ 全"+kan(w.chapters.length)+"章";

    var pane=$("pane"); pane.textContent="";
    var text=document.createElement("div"); text.className="text";
    var h=document.createElement("p"); h.className="chead"; h.textContent=c.title;
    text.appendChild(h);
    c.scenes.forEach(function(sc){
      var d=document.createElement("div"); d.className="scene";
      sc.forEach(function(p){ var el=document.createElement("p"); el.textContent=p; d.appendChild(el); });
      text.appendChild(d);
    });
    var end=document.createElement("p"); end.className="endmark";
    end.textContent = (curCh+1===w.chapters.length) ? "［了］" : "＊";
    text.appendChild(end);
    pane.appendChild(text);

    $("prevCh").disabled = curCh===0;
    $("nextCh").disabled = curCh===w.chapters.length-1;
    $("prevCh").style.opacity = curCh===0?".35":"1";
    $("nextCh").style.opacity = (curCh===w.chapters.length-1)?".35":"1";

    requestAnimationFrame(function(){ toStart(pane); tick(); });
    store.set("pos:"+w.num,{ch:curCh});
    store.set("last",{num:w.num,ch:curCh});
    if(drawer) buildDrawer();
    pane.focus({preventScroll:true});
  }

  function tick(){
    var p=progress($("pane"));
    var w=(p*100).toFixed(1)+"%";
    $("fill").style.width=w;
    $("fill2").style.width=w;
    $("pct").textContent=Math.round(p*100)+"%";
  }

  /* ---------- zen / fullscreen ---------- */
  var zen=false;
  function setZen(on){
    zen=on; document.body.classList.toggle("zen",on);
    requestAnimationFrame(function(){ tick(); $("pane").focus({preventScroll:true}); });
  }
  function toggleZen(){
    var want=!zen;
    setZen(want);
    try{
      if(want){
        var el=document.documentElement;
        var r=el.requestFullscreen||el.webkitRequestFullscreen;
        if(r) Promise.resolve(r.call(el)).catch(function(){});
      }else if(document.fullscreenElement||document.webkitFullscreenElement){
        var x=document.exitFullscreen||document.webkitExitFullscreen;
        if(x) Promise.resolve(x.call(document)).catch(function(){});
      }
    }catch(e){}
  }
  document.addEventListener("fullscreenchange",function(){
    /* leaving fullscreen by Esc or the browser chrome also leaves zen */
    if(!document.fullscreenElement && zen) setZen(false);
  });

  /* ---------- guide ---------- */
  var guide=null, report=null, reportIdx=0, paper=null, paperIdx=0, gtab="people";
  function chips(w){
    var out='<span class="chips">';
    (w.lead||[]).forEach(function(n){ out+='<span class="chip lead">'+n+'</span>'; });
    (w.in||[]).forEach(function(n){ out+='<span class="chip">'+n+'</span>'; });
    return out+'</span>';
  }
  function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

  function renderGuide(){
    var box=$("gsec"); box.textContent="";
    if(gtab!=="paper") document.querySelector(".g-inner").classList.remove("wide");
    if(!guide){ box.innerHTML='<p class="ds">読み込み中</p>'; return; }
    var h="";
    if(gtab==="people"){
      var groups=[["cross","連作をまたぐ人"]];
      guide.works.slice().sort(function(a,b){return a.num<b.num?-1:1;}).forEach(function(w){
        var lbl = w.num.charAt(0)==="i" ? "幕間　"+w.title : w.num+"　"+w.title;
        groups.push([w.num, lbl]);
      });
      groups.forEach(function(g){
        var list=guide.people.filter(function(p){ return p.g===g[0]; });
        if(!list.length) return;
        h+='<h2>'+g[1]+'</h2><div class="pgrid">';
        list.forEach(function(p){
          var i=guide.people.indexOf(p);
          var nm=String(p.name).split(/\s+/);
          var gl=(nm[1]||nm[0]).charAt(0);
          h+='<button class="pcard'+((p.lead||[]).length?" isLead":"")+'" data-p="'+i+'">'+
             '<span class="pic"><span class="gl">'+esc(gl)+'</span>'+
             (p.art?'<img class="pimg" src="'+esc(p.art)+'" alt="" loading="lazy" decoding="async">':'')+
             '</span>'+
             '<span class="pn">'+esc(p.name)+'</span>'+
             '<span class="py">'+esc(p.yomi)+'</span>'+
             '<span class="pr">'+esc(p.role)+'</span>'+chips(p)+'</button>';
        });
        h+='</div>';
      });
      h+='<p class="spoil">札をおすと、その人の詳しいところが出ます。数字つきの札は出てくる作品で、色のついた札はその作品の視点人物です。詳細には、本文に書いていないことも入っています。</p>';
    }
    else if(gtab==="shops"){
      h+='<p class="spoil">札をおすと、その店の詳しいところが出ます。看板、創業、中のようす、売れるもの、通りの人たちの口コミ。「通り」の数字は南（駅側）から北への並び順です。番地はおおむねそれに沿いますが、北の抜けだけが十一番地の枝番で、十二番地（柏湯）より北にあります。</p>';
      [["kashio","柏尾銀天街　南（駅側）から北へ"],["hamuro","羽室銀座（新潟）"],["other","町の外"]].forEach(function(a){
        var list=guide.shops.filter(function(x){ return x.a===a[0]; });
        if(!list.length) return;
        h+='<h2>'+a[1]+'</h2><div class="pgrid">';
        list.forEach(function(x){
          var i=guide.shops.indexOf(x);
          var gone=/閉店|解体/.test(x.state);
          h+='<button class="pcard'+(gone?" isGone":"")+'" data-s="'+i+'">'+
             '<span class="pin2">'+(a[0]==="kashio"?"通り "+x.pos:esc(x.trade))+'</span>'+
             '<span class="gl">'+esc(shopGlyph(x.name))+'</span>'+
             '<span class="pn">'+esc(x.name)+'</span>'+
             (x.chi!=="—"?'<span class="py">'+esc(x.chi)+'</span>':'')+
             '<span class="pst'+(gone?" gone":"")+'">'+esc(x.state)+'</span>'+
             chips({in:x.w})+'</button>';
        });
        h+='</div>';
      });

  /* ---------- 紙面の格子 ----------

  var PG = { W:1240, H:2500, M:24, HEAD:64, DAN:15, GAP:12, HCOL:200, INGAP:16 };
  PG.CW    = PG.W - PG.M*2;                        /* 1192 */
  PG.TOP   = PG.M + PG.HEAD;
  PG.BODYH = PG.H - PG.TOP - PG.M;
  PG.PITCH = PG.BODYH / PG.DAN;                    /* 一段の送り */
  PG.DANH  = PG.PITCH - PG.GAP;                    /* 一段の文字の高さ */
  function danTop(n){ return PG.TOP + (n-1)*PG.PITCH; }          /* n段目の上端 */
  function danH(n){ return n*PG.PITCH - PG.GAP; }                /* n段ぶんの高さ */

  /* 本文を段から段へ流す。入りきらない段落は切って、次の段の頭から続ける */
  function flowDan(slots, paras, by){
    var queue=paras.map(function(t){ return {t:t, ind:true}; });
    if(by) queue.push({t:"（"+by+"）", ind:false, by:true});
    var qi=0;
    slots.forEach(function(el){ el.innerHTML=""; });
    for(var s=0; s<slots.length && qi<queue.length; s++){
      var el=slots[s];
      while(qi<queue.length){
        var it=queue[qi];
        var p=document.createElement("p");
        p.textContent=it.t;
        if(!it.ind) p.style.textIndent="0";
        if(it.by) p.className="by";
        el.appendChild(p);
        if(el.scrollWidth<=el.clientWidth+1){ qi++; continue; }
        var lo=0, hi=it.t.length, best=0;
        while(lo<=hi){
          var mid=(lo+hi)>>1;
          p.textContent=it.t.slice(0,mid);
          if(el.scrollWidth<=el.clientWidth+1){ best=mid; lo=mid+1; } else { hi=mid-1; }
        }
        if(best<=0){ el.removeChild(p); break; }
        p.textContent=it.t.slice(0,best);
        queue[qi]={t:it.t.slice(best), ind:false};
        break;
      }
    }
    return { done: qi>=queue.length, left: queue.length-qi };
  }

  function placeLead(P){
    /* 写真を P 段、題を三段（幅二百＝半段）に置き、本文の段を返す */
    var ph=$("pPhoto"), hc=$("pHead"), px=PG.M;
    ph.style.left=px+"px"; ph.style.width=PG.CW+"px";
    ph.style.top=danTop(1)+"px"; ph.style.height=danH(P)+"px";
    var hTop=P+1, hSpan=Math.min(3, 7-P);
    hc.style.right=PG.M+"px"; hc.style.width=PG.HCOL+"px";
    hc.style.top=danTop(hTop)+"px"; hc.style.height=danH(hSpan)+"px";
    var narrow=PG.CW-PG.HCOL-PG.INGAP, slots=[], k=0;
    for(var n=hTop; n<=7 && k<5; n++, k++){
      var el=$("dan"+k), wide=(n>=hTop+hSpan);
      el.style.left=PG.M+"px";
      el.style.width=(wide?PG.CW:narrow)+"px";
      el.style.top=danTop(n)+"px"; el.style.height=PG.DANH+"px";
      el.style.display="block";
      slots.push(el);
    }
    for(; k<5; k++){ $("dan"+k).style.display="none"; $("dan"+k).innerHTML=""; }
    return { slots: slots, hTop: hTop, hSpan: hSpan, narrow: narrow };
  }

  function layoutLead(d){
    var L=d.lead||{}, best=null;
    for(var P=5; P>=2; P--){                      /* 写真は大きいほうから試す */
      var g=placeLead(P);
      var r=flowDan(g.slots, L.body||[], L.by);
      if(r.done){ best={P:P, g:g}; break; }
    }
    if(!best){ best={P:2, g:placeLead(2)}; flowDan(best.g.slots, L.body||[], L.by); }
    else { placeLead(best.P); flowDan(best.g.slots, L.body||[], L.by); }

    /* 最後の段に余りがあれば、そこに連載の囲みを置く */
    var bx=$("pInset"), last=best.g.slots[best.g.slots.length-1];
    var used=last?Math.min(parseFloat(last.style.width), last.scrollWidth):0;
    var slack=last?parseFloat(last.style.width)-used-14:0;
    if(bx){
      if(last && slack>150){
        last.style.width=used+"px";
        bx.style.display="block";
        bx.style.left=PG.M+"px"; bx.style.width=slack+"px";
        bx.style.top=last.style.top; bx.style.height=PG.DANH+"px";
      } else bx.style.display="none";
    }
    /* 短い記事も同じ段送りで流す */
    (d.news||[]).slice(0,4).forEach(function(n,i){
      var sl=[];
      for(var k2=0;k2<4;k2++){ var e=$("nd"+i+"_"+k2); if(e) sl.push(e); }
      if(sl.length) flowDan(sl, n.body||[], null);
    });

    var note=$("pNote");
    if(note) note.textContent="一ページ十五段。主記事は段一〜七（半ページ）。写真"+
      best.P+"段、題と署名〇・五段、本文"+(7-best.P-0.5).toFixed(1)+"段。本文"+L.chars+"字。";
    return best.P;
  }

  function fitPaper(){
    var page=$("paperPage"); if(!page) return;
    var wrap=page.parentNode;
    var k=Math.min(1, wrap.clientWidth/PG.W);
    page.style.transform="scale("+k+")";
    wrap.style.height=(PG.H*k)+"px";
  }

      b+='</div>';
    }
    if(p.note) b+='<div class="pfield"><h4>書くときの約束</h4><p>'+esc(p.note)+'</p></div>';
    if(p.seed) b+='<div class="pseed"><h4>まだ書いていないこと</h4><p>'+esc(p.seed)+'</p></div>';

    mountSheet("人物", p.name, b);
  }
  var SF=[["full","看板"],["born","創業"],["who","店にいる人"],["hours","開けている時間"],
          ["inside","中のようす"],["note","おぼえがき"]];

  function openShop(i){
    var x=guide.shops[i]; if(!x) return;
    closePerson();
    var gone=/閉店|解体/.test(x.state);
    var b='<p class="big">'+esc(x.name)+'</p>'+
          '<p class="sub">'+esc(x.trade)+(x.chi!=="—"?'　'+esc(x.chi):'')+
          (x.since!=="—"?'　'+esc(x.since):'')+'</p>'+
          '<p class="rl2'+(gone?" gone":"")+'">'+esc(x.state)+'</p>'+chips({in:x.w});
    SF.forEach(function(f){
      if(!x[f[0]]) return;
      b+='<div class="pfield"><h4>'+f[1]+'</h4><p>'+esc(x[f[0]])+'</p></div>';
    });
    if(x.menu&&x.menu.length){
      b+='<div class="pfield"><h4>売れるもの</h4><div class="pmenu">';
      x.menu.forEach(function(r){
        b+='<div class="mrow"><span class="mn">'+esc(r[0])+'</span>'+
           '<span class="mp">'+esc(r[1])+'</span>'+
           (r[2]?'<p class="mc">'+esc(r[2])+'</p>':'')+'</div>';
      });
      b+='</div></div>';
    }
    if(x.voices&&x.voices.length){
      b+='<div class="pfield"><h4>通りの人の口コミ</h4>';
      x.voices.forEach(function(r){
        var j=-1, who=String(r[0]).replace(/（.*$/,"");
        guide.people.forEach(function(q,k){ if(q.name===who) j=k; });
        b+='<div class="psee">'+
           (j>=0?'<button class="who link" data-jump="'+j+'">'+esc(r[0])+'</button>'
                :'<span class="who">'+esc(r[0])+'</span>')+
           '<p>'+esc(r[1])+'</p></div>';
      });
      b+='</div>';
    }
    if(x.seed) b+='<div class="pseed"><h4>まだ書いていないこと</h4><p>'+esc(x.seed)+'</p></div>';
    mountSheet("店", x.name, b);
  }

  function mountSheet(kind, label, b){
    var scrim=document.createElement("div"); scrim.className="scrim"; scrim.style.zIndex=30;
    psheet=document.createElement("div"); psheet.className="psheet";
    psheet.setAttribute("role","dialog"); psheet.setAttribute("aria-label",label);
    psheet.innerHTML='<div class="pbox"><div class="phead"><span class="t">'+kind+'</span>'+
      '<button class="btn ghost" data-close>閉じる</button></div>'+
      '<div class="pbody">'+b+'</div></div>';
    document.body.appendChild(scrim); document.body.appendChild(psheet);
    psheet._scrim=scrim;
    scrim.addEventListener("click",closePerson);
    psheet.querySelector("[data-close]").addEventListener("click",closePerson);
    Array.prototype.forEach.call(psheet.querySelectorAll("[data-jump]"),function(x){
      x.addEventListener("click",function(){ openPerson(+x.getAttribute("data-jump")); });
    });
    var shot=psheet.querySelector(".pshot img");
    if(shot){
      var wrap=shot.parentNode;
      shot.addEventListener("error",function(){ wrap.classList.add("dead"); });
      if(shot.complete && shot.naturalWidth===0) wrap.classList.add("dead");
    }
    psheet.querySelector("[data-close]").focus();
  }

  function closePerson(){
    if(!psheet) return;
    psheet._scrim.remove(); psheet.remove(); psheet=null;
  }
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&psheet){ e.preventDefault(); closePerson(); }
  });

  function openGuide(){
    $("library").hidden=true; $("reader").hidden=true; $("guide").hidden=false;
    closeDrawer();
    if(guide){ renderGuide(); return; }
    renderGuide();
    fetch("data/guide.json").then(function(r){ return r.json(); }).then(function(d){
      guide=d; renderGuide();
    }).catch(function(){ $("gsec").innerHTML='<p class="ds">資料を読み込めませんでした。</p>'; });
  }

  function goCh(d){
    if(!cur) return;
    var n=curCh+d;
    if(n<0||n>=cur.chapters.length) return;
    show(cur,n);
  }

  function toLibrary(){
    setZen(false);
    $("reader").hidden=true; $("guide").hidden=true; $("library").hidden=false;
    renderLibrary(); closeDrawer();
  }

  /* ---------- drawer ---------- */
  function buildDrawer(){
    var body=drawer.querySelector(".dbody"); body.textContent="";
    index.forEach(function(w){
      var head=document.createElement("div"); head.className="dwork";
      head.textContent=w.num+"　"+w.title;
      body.appendChild(head);
      w.chapters.forEach(function(t,i){
        var b=document.createElement("button"); b.className="chap";
        if(cur && w.num===cur.num && i===curCh) b.setAttribute("aria-current","true");
        b.innerHTML='<span class="ci">'+(i+1)+'</span><span class="ct">'+t.replace(/^第[^　]+章　?/,"")+'</span>';
        b.addEventListener("click",function(){ closeDrawer(); open(w.num,i); });
        body.appendChild(b);
      });
    });
  }
  function openDrawer(){
    if(drawer) return;
    var scrim=document.createElement("div"); scrim.className="scrim";
    scrim.addEventListener("click",closeDrawer);
    drawer=document.createElement("div"); drawer.className="drawer";
    drawer.setAttribute("role","dialog"); drawer.setAttribute("aria-label","目次");
    drawer.innerHTML='<div class="dhead"><h2>目次</h2><button class="btn ghost" data-close>閉じる</button></div>'+
      '<div class="dbody"></div>'+
      '<div class="backline"><button class="btn" data-lib>作品一覧</button> <button class="btn" data-guide>資料</button></div>';
    document.body.appendChild(scrim); document.body.appendChild(drawer);
    drawer.querySelector("[data-close]").addEventListener("click",closeDrawer);
    drawer.querySelector("[data-lib]").addEventListener("click",function(){ closeDrawer(); toLibrary(); });
    drawer.querySelector("[data-guide]").addEventListener("click",function(){ closeDrawer(); openGuide(); });
    drawer._scrim=scrim;
    buildDrawer();
    var act=drawer.querySelector('[aria-current="true"]');
    if(act) act.scrollIntoView({block:"center"});
    drawer.querySelector("[data-close]").focus();
  }
  function closeDrawer(){
    if(!drawer) return;
    drawer._scrim.remove(); drawer.remove(); drawer=null;
  }

  /* ---------- wire ---------- */
  $("toLib").addEventListener("click",toLibrary);
  $("toGuide").addEventListener("click",function(){ gtab="people"; syncTabs(); openGuide(); });
  $("toReport").addEventListener("click",function(){ gtab="report"; syncTabs(); openGuide(); });
  $("toPaper").addEventListener("click",function(){ gtab="paper"; syncTabs(); openGuide(); });
  function syncTabs(){
    Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(o){
      o.setAttribute("aria-selected", o.dataset.tab===gtab ? "true" : "false");
    });
  }
  $("gBack").addEventListener("click",toLibrary);
  $("zenBtn").addEventListener("click",toggleZen);
  $("zenout").addEventListener("click",function(){ toggleZen(); });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){
    t.addEventListener("click",function(){
      gtab=t.dataset.tab; syncTabs();
      renderGuide(); $("guide").scrollTop=0;
    });
  });
  $("tocBtn").addEventListener("click",function(){ drawer?closeDrawer():openDrawer(); });
  $("prevCh").addEventListener("click",function(){ goCh(-1); });
  $("nextCh").addEventListener("click",function(){ goCh(1); });
  $("tateBtn").addEventListener("click",function(){
    tate=!tate; store.set("tate",tate); applyMode();
    requestAnimationFrame(function(){ toStart($("pane")); tick(); });
  });
  $("fsBtn").addEventListener("click",function(){
    sizeIdx=(sizeIdx+1)%SIZES.length; store.set("size",sizeIdx); applyMode();
    requestAnimationFrame(tick);
  });
  $("pane").addEventListener("scroll",tick,{passive:true});
  window.addEventListener("resize",function(){ requestAnimationFrame(tick); requestAnimationFrame(fitPaper); });
  document.addEventListener("keydown",function(e){
    if($("reader").hidden) return;
    if(e.key==="Escape"){
      if(drawer){ closeDrawer(); return; }
      if(zen){ toggleZen(); return; }
    }
    if(e.target.closest(".drawer")) return;
    if(e.key==="ArrowLeft"){ e.preventDefault(); page(tate?1:-1); }
    else if(e.key==="ArrowRight"){ e.preventDefault(); page(tate?-1:1); }
    else if(e.key===" "){ e.preventDefault(); page(e.shiftKey?-1:1); }
    else if(e.key==="ArrowDown"&&!tate){ return; }
  });

  /* ---------- ホーム画面に追加 / オフライン ---------- */
  var deferredPrompt=null;
  window.addEventListener("beforeinstallprompt",function(e){
    e.preventDefault(); deferredPrompt=e;
    var b=$("installBtn"); if(b) b.hidden=false;
  });
  window.addEventListener("appinstalled",function(){
    deferredPrompt=null;
    var b=$("installBtn"); if(b) b.hidden=true;
  });
  if($("installBtn")){
    $("installBtn").addEventListener("click",function(){
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(){
        deferredPrompt=null; $("installBtn").hidden=true;
      });
    });
  }
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      try{
        navigator.serviceWorker.register("sw.js").then(function(){
          var n=$("offlineNote"); if(n) n.hidden=false;
        }).catch(function(){});
      }catch(e){}
    });
  }

  applyMode();
  fetch("data/index.json").then(function(r){ return r.json(); }).then(function(d){
    index=d; renderLibrary();
    var last=store.get("last",null);
    var hash=(location.hash||"").replace("#","");
    if(hash==="report"){ gtab="report"; syncTabs(); openGuide(); }
    else if(hash==="guide"){ openGuide(); }
    else if(/^w[0-7]\d?$/.test(hash)){ open(hash.slice(1,3),0); }
    else if(last){ /* stay on library; the row shows the bookmark */ }
  }).catch(function(){
    $("works").innerHTML='<li class="work" style="padding:2rem 0;color:var(--muted)">本文を読み込めませんでした。</li>';
  });
})();
</script>
