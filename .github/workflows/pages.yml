# reader/ を GitHub Pages に出す。
# 手動実行だけにしてある。Settings → Pages → Source を「GitHub Actions」にしてから使う。
name: reader を GitHub Pages に出す

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: データを作り直す
        run: |
          python3 tools/リーダー用データ.py
          python3 tools/資料データ.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reader
      - id: deployment
        uses: actions/deploy-pages@v4
